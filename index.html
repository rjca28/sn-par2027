function alternarMembro(ativId, key){
  const c = conv(ativId);
  const m = c.membros.find(x => x.key === key); if (!m) return;
  if (m.estado === 'removido'){ m.estado = m.viaOriginal === 'adicionado' ? 'adicionado' : 'auto'; salvar(); render(); return; }
  const ta = el('textarea', { placeholder:'Motivo da exclusão (lesão, desistência, decisão fundamentada da DTN…)' });
  ta.value = m.justificacao || '';
  abrirModal('Remover ' + m.nome, el('div', {},
    el('p', { class:'small muted' }, 'O nadador mantém-se registado na convocatória, assinalado como removido, com a justificação para efeitos de fundamentação.'),
    el('label', { class:'f' }, el('span', {}, 'Justificação'), ta)),
    [el('button', { class:'btn', onclick:fecharModal }, 'Cancelar'),
     el('button', { class:'btn primary', onclick:() => {
        m.viaOriginal = m.estado; m.estado = 'removido'; m.justificacao = ta.value.trim();
        salvar(); fecharModal(); render();
     } }, 'Remover da convocatória')]);
  setTimeout(() => ta.focus(), 40);
}
function editarJustificacao(ativId, key){
  const c = conv(ativId); const m = c.membros.find(x => x.key === key); if (!m) return;
  const ta = el('textarea', {}); ta.value = m.justificacao || '';
  abrirModal('Justificação — ' + m.nome,
    el('label', { class:'f' }, el('span', {}, 'Texto que acompanha a convocatória'), ta),
    [el('button', { class:'btn', onclick:fecharModal }, 'Cancelar'),
     el('button', { class:'btn primary', onclick:() => { m.justificacao = ta.value.trim(); salvar(); fecharModal(); render(); } }, 'Guardar')]);
  setTimeout(() => ta.focus(), 40);
}
function adicionarMembro(ativId, key, nome, justificacao){
  const c = conv(ativId);
  const ex = c.membros.find(x => x.key === key);
  if (ex){ ex.estado = 'adicionado'; if (justificacao) ex.justificacao = justificacao; }
  else {
    const ativ = ATIVIDADES.find(a => a.id === ativId);
    const n = S.db.nadadores.get(key);
    const p = n ? perfil(n, ativ) : null;
    c.membros.push({ key, nome: nome || (n ? n.nome : key), estado:'adicionado',
      justificacao: justificacao || '', via:'Decisão da DTN',
      provas: p ? (p.comIndice.length ? p.comIndice : p.provas).slice(0,3).map(x => x.ev) : [] });
  }
  salvar(); fecharModal(); render();
  toast('Nadador adicionado à convocatória.');
}
function modalAdicionar(ativId){
  const ativ = ATIVIDADES.find(a => a.id === ativId);
  const c = conv(ativId);
  const jaLa = new Set(c.membros.filter(m => m.estado !== 'removido').map(m => m.key));
  const inp = el('input', { type:'text', placeholder:'Procurar por nome ou clube…' });
  const just = el('textarea', { placeholder:'Justificação da convocatória (obrigatória para fundamentar a decisão)' });
  const lista = el('div', { style:'max-height:320px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px' });
  const todos = [...S.db.nadadores.values()];
  const pintar = () => {
    const q = inp.value.trim().toLowerCase();
    lista.replaceChildren();
    const res = todos.filter(n => !jaLa.has(n.key) &&
      (!q || n.nome.toLowerCase().includes(q) || (n.clube||'').toLowerCase().includes(q))).slice(0, 60);
    if (!res.length){ lista.append(el('p', { class:'muted small', style:'padding:14px' }, 'Sem resultados.')); return; }
    for (const n of res){

      lista.append(el('div', { style:'display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-2)' },
        el('div', { style:'flex:1;min-width:0' },
          el('div', { class:'nome' }, n.nome),
          el('div', { class:'small muted' }, `${idadeEm(n.nasc, S.cfg.refIdade)} anos · ${n.clube || '—'}` +
            (p.melhor ? ` · melhor: ${p.melhor.ev} ${fmtTime(p.melhor.t)} (${p.melhor.pts}p)` : ''))),
        p.comIndice.length ? el('span', { class:'pill good' }, 'cumpre índice') : el('span', { class:'pill' }, 'sem índice'),

let qNad = '';
function vNadadores(v){
  if (!S.db) return semDados(v);
  const inp = el('input', { type:'text', placeholder:'Procurar por nome, clube ou associação…' });
  inp.value = qNad;
  inp.addEventListener('input', () => { qNad = inp.value; pintar(); });
  const cont = el('div', {});
  const pintar = () => {
    const q = qNad.trim().toLowerCase();
    const todos = [...S.db.nadadores.values()]
      .filter(n => !q || n.nome.toLowerCase().includes(q) || (n.clube||'').toLowerCase().includes(q) || (n.regiao||'').toLowerCase().includes(q));
    const lista = todos.map(n => {
      const idade = idadeEm(n.nasc, S.cfg.refIdade);
      let melhorPts = 0, melhorEv = null, niveis = new Set();
      for (const r of n.res){
        const p = ptsDe(S.db, r);
        if (p > melhorPts){ melhorPts = p; melhorEv = r; }
        for (const niv of Object.keys(NIVEIS)){
          const f = FAIXA_NIVEL[niv];
          if (idade < f[0] || idade > f[1]) continue;
          const it = idxTime(S.cfg.indices, r.curso, niv, r.g, r.ev);
          if (it && r.t <= it) niveis.add(niv);
        }

async function exportarWorkspace(){

function importarWorkspace(){

      toast('Cópia restaurada.');

/* ==========================================================================
   ESTAFETAS
   ========================================================================== */
function nomesEstafetas(ativ){
  const cursos = (ativ.regra && ativ.regra.piscina) || ['PL'];
  const evs = ESTAFETAS.filter(e => e.piscina.some(p => cursos.includes(p)));
  const out = [];
  for (const e of evs){ out.push(e.ev); out.push(e.ev + ' Misto'); }
  return out;
}
/* percursos de cada estafeta: os estilos vão na ordem costas, bruços, mariposa, livres */
function pernasEstafeta(ev){
  const m = String(ev).match(/^4x(\d+)\s+(\w+)/);
  if (!m) return [];
  const d = m[1];
  return m[2] === 'Est'
    ? [`${d} Cos`, `${d} Bru`, `${d} Mar`, `${d} Liv`]
    : [`${d} Liv`, `${d} Liv`, `${d} Liv`, `${d} Liv`];
}
function melhorEm(nadKey, ev, ativ){
  const n = S.db && S.db.nadadores.get(nadKey);
  if (!n) return null;
  const cursos = (ativ.regra && ativ.regra.piscina) || ['PL'];
  let melhor = null;
  for (const r of n.res){
    if (r.ev !== ev || !cursos.includes(r.curso)) continue;
    if (r.lap && !S.cfg.incluirLap) continue;
    if (!melhor || r.t < melhor.t) melhor = r;
  }
  return melhor;
}

function sincronizarProvasEstafetas(ativId){
  const c = conv(ativId);
  const todas = new Set();
  (c.estafetas || []).forEach(e => todas.add(rotuloEstafeta(e)));
  for (const m of c.membros){
    m.provas = (m.provas || []).filter(p => !/^4x/.test(p) || todas.has(p));
    for (const e of (c.estafetas || [])){
      const rot = rotuloEstafeta(e);
      if ((e.nadadores || []).includes(m.key) && !m.provas.includes(rot)) m.provas.push(rot);
      if (!(e.nadadores || []).includes(m.key)) m.provas = m.provas.filter(p => p !== rot);
    }
  }
  salvar();
}
const rotuloEstafeta = e => e.ev + (e.genero === 'X' ? ' Misto' : '');

function cardEstafetas(ativ){
  const c = conv(ativ.id);
  c.estafetas = c.estafetas || [];
  const membros = linhasConvocatoria(ativ.id).filter(l => l.estado !== 'removido');
  const corpo = el('div', { style:'display:flex;flex-direction:column;gap:14px' });

  const pintar = () => {
    corpo.replaceChildren();
    if (!c.estafetas.length)
      corpo.append(el('p', { class:'muted small', style:'margin:0' },
        'Sem estafetas inscritas. Escolha a prova acima para acrescentar uma e depois indique os nadadores de cada percurso.'));

    c.estafetas.forEach((e, i) => {
      const pernas = pernasEstafeta(e.ev);
      e.nadadores = e.nadadores || ['', '', '', ''];
      while (e.nadadores.length < 4) e.nadadores.push('');
      const elegiveis = membros.filter(m => e.genero === 'X' || m.g === e.genero);

      const tw = el('div', { class:'tw' });
      const t = el('table', { class:'grelha' });
      t.append(el('thead', {}, el('tr', {},
        el('th', { class:'gnum' }, '#'), el('th', {}, 'Percurso'),
        el('th', {}, 'Nadador'), el('th', { class:'num' }, 'Melhor tempo'),
        el('th', { class:'num' }, 'Pts WA'), el('th', { class:'gnum' }, ''))));
      const tb = el('tbody', {});
      let soma = 0, completa = true;

      e.nadadores.forEach((key, j) => {
        const evPerna = pernas[Math.min(j, 3)];
        const usados = new Set(e.nadadores.filter((k, x) => k && x !== j));
        const sel = el('select', { style:'min-width:200px' },
          el('option', { value:'' }, j < 4 ? '— escolher nadador —' : '— reserva —'),
          ...elegiveis.filter(m => !usados.has(m.key) || m.key === key)
            .map(m => el('option', { value:m.key }, `${m.nome} (${m.g})`)));
        sel.value = key || '';
        sel.addEventListener('change', () => {
          e.nadadores[j] = sel.value;
          sincronizarProvasEstafetas(ativ.id);
          pintar();
        });
        const r = key ? melhorEm(key, evPerna, ativ) : null;
        if (j < 4){
          if (r) soma += r.t; else completa = false;
        }
        tb.append(el('tr', {},
          el('td', { class:'gnum muted mono' }, j < 4 ? String(j + 1) : 'R'),
          el('td', { class:'small' }, j < 4 ? evPerna : 'reserva'),
          el('td', {}, sel),
          el('td', { class:'num' }, r ? fmtTime(r.t) : '—'),
          el('td', { class:'num' }, r ? String(ptsDe(S.db, r)) : '—'),
          el('td', { class:'gnum' }, j >= 4
            ? el('button', { class:'gx', title:'Remover reserva',
                onclick:() => { e.nadadores.splice(j, 1); sincronizarProvasEstafetas(ativ.id); pintar(); } }, '×')
            : '')));
      });
      t.append(tb); tw.append(t);

      const nota = el('input', { type:'text', placeholder:'Observação (ordem a confirmar, decisão em estágio…)' });
      nota.value = e.nota || '';
      nota.addEventListener('input', () => { e.nota = nota.value; salvar(); });

      corpo.append(el('div', { class:'bloco' },
        el('div', { class:'bloco-top' },
          el('span', { class:'bloco-n mono' }, String(i + 1)),
          el('strong', { style:'font-family:var(--font-d);font-size:15px' }, e.ev),
          el('span', { class:'pill ' + (e.genero === 'X' ? 'acc' : 'good') },
            (GENEROS_EST.find(g => g.id === e.genero) || {}).label),
          completa
            ? el('span', { class:'pill acc' }, 'soma dos parciais ' + fmtTime(soma))
            : el('span', { class:'pill warn' }, 'equipa incompleta'),

/* ==========================================================================
   INFORMAÇÕES DA CONVOCATÓRIA — pontos livres (alojamento, viagem, notas…)

function substituirMarcadores(txt, ativ){
  return String(txt || '')
    .replace(/\{dataIni\}/g, dataLonga(ativ.dataIni) || ativ.datas)
    .replace(/\{dataFim\}/g, dataLonga(ativ.dataFim) || ativ.datas)
    .replace(/\{datas\}/g, ativ.datas)
    .replace(/\{local\}/g, ativ.local)
    .replace(/\{atividade\}/g, ativ.nome);
}
function novoBloco(modeloId, ativ){
  const m = BLOCOS_MODELO.find(x => x.id === modeloId) || BLOCOS_MODELO.find(x => x.id === 'livre');
  return { uid: 'b' + Math.random().toString(36).slice(2, 9),
    titulo: substituirMarcadores(m.titulo, ativ), tipo: m.tipo,
    conteudo: substituirMarcadores(m.conteudo, ativ) };
}
const TIPO_BLOCO = { texto:'Parágrafo', lista:'Lista de pontos', tabela:'Tabela (colunas separadas por |)' };


/* editor de tabela de um bloco: cabeçalho e células editáveis, linhas e colunas */
function ajustarLargura(inp){
  inp.size = Math.max(9, Math.min(44, (inp.value || '').length + 2));
}
function editorTabela(b, aoMudar){
  const parse = () => {
    const linhas = String(b.conteudo || '').split('\n').filter(l => l.trim() !== '' || true);
    const grelha = linhas.map(l => l.split('|').map(x => x.trim()));
    const nCols = Math.max(1, ...grelha.map(r => r.length));
    grelha.forEach(r => { while (r.length < nCols) r.push(''); });
    if (!grelha.length) grelha.push(['Coluna 1']);
    if (grelha.length === 1) grelha.push(grelha[0].map(() => ''));
    return grelha;
  };
  let dados = parse();
  const gravar = () => { b.conteudo = dados.map(r => r.join(' | ')).join('\n'); aoMudar(); };
  const caixa = el('div', { class:'tabela-ed' });

  const pintar = () => {
    caixa.replaceChildren();
    const tw = el('div', { class:'tw' });
    const t = el('table', { class:'grelha' });
    const thead = el('thead', {}), trh = el('tr', {});
    trh.append(el('th', { class:'gnum' }, ''));
    dados[0].forEach((c, j) => {
      const inp = el('input', { type:'text', placeholder:'Cabeçalho' });
      inp.value = c; ajustarLargura(inp);
      inp.addEventListener('input', () => { dados[0][j] = inp.value; ajustarLargura(inp); gravar(); });
      trh.append(el('th', {}, el('div', { class:'gcol' }, inp,
        el('button', { class:'gx', title:'Eliminar coluna', onclick:() => {
          if (dados[0].length <= 1) return;
          dados.forEach(r => r.splice(j, 1)); gravar(); dados = parse(); pintar();
        } }, '×'))));
    });
    trh.append(el('th', { class:'gnum' }, ''));
    thead.append(trh); t.append(thead);

    const tb = el('tbody', {});
    dados.slice(1).forEach((linha, i) => {
      const tr = el('tr', {});
      tr.append(el('td', { class:'gnum muted mono' }, String(i + 1)));
      linha.forEach((c, j) => {
        const inp = el('input', { type:'text' });
        inp.value = c; ajustarLargura(inp);
        inp.addEventListener('input', () => { dados[i + 1][j] = inp.value; ajustarLargura(inp); gravar(); });
        tr.append(el('td', {}, inp));
      });
      tr.append(el('td', { class:'gnum' },
        el('button', { class:'gx', title:'Eliminar linha', onclick:() => {
          dados.splice(i + 1, 1);
          if (dados.length === 1) dados.push(dados[0].map(() => ''));
          gravar(); dados = parse(); pintar();
        } }, '×')));
      tb.append(tr);
    });
    t.append(tb); tw.append(t);
    caixa.append(tw, el('div', { class:'tabela-btns' },
      el('button', { class:'btn sm', onclick:() => { dados.push(dados[0].map(() => '')); gravar(); pintar(); } }, '+ Linha'),
      el('button', { class:'btn sm', onclick:() => {
        dados[0].push('Coluna ' + (dados[0].length + 1));
        dados.slice(1).forEach(r => r.push(''));
        gravar(); pintar();
      } }, '+ Coluna'),
      el('span', { class:'small muted', style:'align-self:center' },
        'A primeira linha é o cabeçalho da tabela nos documentos.')));
  };
  pintar();
  return caixa;
}

function cardBlocos(ativ){
  const c = conv(ativ.id);
  c.blocos = c.blocos || [];
  const corpo = el('div', { class:'blocos' });

  const pintar = () => {
    corpo.replaceChildren();

      corpo.append(el('p', { class:'muted small', style:'margin:0 0 12px' },
        'Ainda não há pontos. Acrescente alojamento, horas de concentração, plano de viagem, notas — tudo o que deve seguir na convocatória.'));
    c.blocos.forEach((b, i) => {
      const tit = el('input', { type:'text', placeholder:'Título do ponto (ex.: Alojamento)' });
      tit.value = b.titulo;
      tit.addEventListener('input', () => { b.titulo = tit.value; salvar(); });

      const tipo = el('select', {}, ...Object.entries(TIPO_BLOCO).map(([k, v]) => el('option', { value:k }, v)));
      tipo.value = b.tipo;
      tipo.addEventListener('change', () => { b.tipo = tipo.value; salvar(); pintar(); });

      let cont;

        cont = editorTabela(b, () => salvar());
      } else {
        cont = el('textarea', { rows: b.tipo === 'texto' ? 3 : 5,
          placeholder: b.tipo === 'lista' ? 'Um ponto por linha' : 'Texto do ponto' });

        cont.addEventListener('input', () => { b.conteudo = cont.value; salvar(); });

      corpo.append(el('div', { class:'bloco' },
        el('div', { class:'bloco-top' },
          el('span', { class:'bloco-n mono' }, String(i + 1)),
          tit, tipo,
          el('button', { class:'btn sm ghost', title:'Subir', disabled:i === 0,
            onclick:() => { const [x] = c.blocos.splice(i, 1); c.blocos.splice(i - 1, 0, x); salvar(); pintar(); } }, '↑'),
          el('button', { class:'btn sm ghost', title:'Descer', disabled:i === c.blocos.length - 1,
            onclick:() => { const [x] = c.blocos.splice(i, 1); c.blocos.splice(i + 1, 0, x); salvar(); pintar(); } }, '↓'),
          el('button', { class:'btn sm ghost', title:'Duplicar',

          el('button', { class:'btn sm ghost', title:'Eliminar',

    c.blocos.push(novoBloco(seletor.value, ativ));
    seletor.value = ''; salvar(); pintar();
  });

  const conjunto = el('select', { style:'max-width:250px' },

    ...CONJUNTOS_BLOCOS.map(x => el('option', { value:x.id }, x.nome)));
  conjunto.addEventListener('change', () => {
    if (!conjunto.value) return;
    const cj = CONJUNTOS_BLOCOS.find(x => x.id === conjunto.value);
    cj.blocos.forEach(id => c.blocos.push(novoBloco(id, ativ)));
    conjunto.value = ''; salvar(); pintar();
    toast(`${cj.blocos.length} pontos acrescentados. Edite as datas, horas e voos.`);
  });

  return el('div', { class:'card' },
    el('header', {},
      el('div', {},
        el('h3', {}, 'Informações da convocatória'),
        el('div', { class:'small muted' }, 'Estes pontos saem no PDF, no Word e no corpo do e-mail, pela ordem em que aqui estão.')),
      el('span', { class:'sp', style:'flex:1' }), seletor, conjunto),
    el('div', { class:'body' }, corpo));
}

/* ==========================================================================
   ENVIO POR E-MAIL
   ========================================================================== */
function textoBlocos(c, prefixo){
  const out = [];
  for (const b of (c.blocos || [])){
    if (!b.titulo && !b.conteudo) continue;
    out.push((prefixo || '') + b.titulo.toUpperCase());
    const linhas = String(b.conteudo || '').split('\n').filter(x => x.trim());
    if (b.tipo === 'lista') linhas.forEach(l => out.push('  • ' + l.trim()));
    else if (b.tipo === 'tabela'){
      const grelha = linhas.map(l => l.split('|').map(x => x.trim()));
      const nCols = Math.max(...grelha.map(r => r.length));
      grelha.forEach(r => { while (r.length < nCols) r.push(''); });
      const larg = [];
      for (let j = 0; j < nCols; j++) larg[j] = Math.max(...grelha.map(r => (r[j] || '').length));
      grelha.forEach((r, i) => {
        out.push('  ' + r.map((c, j) => c.padEnd(larg[j])).join('   ').trimEnd());
        if (i === 0) out.push('  ' + larg.map(w => '─'.repeat(w)).join('───'));
      });
    }
    else linhas.forEach(l => out.push(l.trim()));
    out.push('');
  }
  return out.join('\n');
}

function mensagemEmail(ativId){
  const ass = S.cfg.email.assinatura || '';
  if (!ativId){
    const st = estatisticas();
    return [`Junta-se o painel de convocatórias do Plano de Atividades 2027 das Seleções Nacionais de Natação Pura.`, '',
      `Convocatórias geradas: ${st.convs.length} de ${ATIVIDADES.length} atividades.`,
      `Nadadores distintos convocados: ${st.convocados.size}, de ${Object.keys(st.porClube).length} clubes.`,
      `Documento gerado a ${HOJE()}.`, '',
      'O ficheiro PDF segue em anexo.', '', ass].join('\n');
  }
  const d = dadosConv(ativId);
  const linhas = [
    `Convocatória ${d.ativ.id} — ${d.ativ.nome}`,
    `${d.sel.nome} · ${d.ativ.datas}${d.ativ.aDefinir ? ' (a confirmar)' : ''} · ${d.ativ.local}`, '',
    `Nadadores convocados (${d.ativos.length}):`];
  d.ativos.forEach((l, i) => linhas.push(`  ${i + 1}. ${l.nome}${l.clube ? ' — ' + l.clube : ''}` +
    (d.ativ.tipo !== 'Estágio' && (l.provas || []).length ? '  [' + l.provas.join(', ') + ']' : '')));
  if (d.c.treinadores && d.c.treinadores.length){
    linhas.push('', 'Treinadores convidados:');
    d.c.treinadores.forEach(t => linhas.push(`  • ${t.nome} — ${t.clube}`));
  }
  const est = (d.c.estafetas || []).filter(e => (e.nadadores || []).some(Boolean));
  if (est.length){
    linhas.push('', 'Estafetas:');
    est.forEach(e => {
      const pernas = pernasEstafeta(e.ev);
      linhas.push(`  • ${rotuloEstafeta(e)} — ${(GENEROS_EST.find(g => g.id === e.genero) || {}).label}` +
        (e.nota ? ` (${e.nota})` : ''));
      (e.nadadores || []).slice(0, 4).forEach((k, j) => {
        const m = d.ativos.find(x => x.key === k);
        linhas.push(`      ${j + 1}. ${pernas[j]} — ${m ? m.nome : '(por definir)'}`);
      });
      const res = (e.nadadores || []).slice(4).filter(Boolean).map(k => {
        const m = d.ativos.find(x => x.key === k); return m ? m.nome : null;
      }).filter(Boolean);
      if (res.length) linhas.push(`      reservas: ${res.join(' · ')}`);
    });
  }
  const bl = textoBlocos(d.c);
  if (bl) linhas.push('', bl.trimEnd());
  if (d.c.nota) linhas.push('', d.c.nota);
  if (incluirNaoConv(ativId)){
    const rr = resultado(ativId);
    const quase = (rr.excluidos || []).slice(0, 15);
    if (quase.length){
      linhas.push('', 'CANDIDATOS NÃO CONVOCADOS — DISTÂNCIA AO CRITÉRIO');
      quase.forEach(x => {
        const m = x.melhor || x.melhorGeral;
        const falta = (m && m.idx != null) ? m.t - m.idx : null;
        linhas.push(`  • ${x.nome}${x.clube ? ' (' + x.clube + ')' : ''}` +
          (m ? ` — ${m.ev} ${fmtTime(m.t)}, índice ${fmtTime(m.idx)}` : '') +
          (falta != null ? `, falta ${fmtDelta(falta)}` : '') +
          (m && m.delta != null ? ` (${m.delta > 0 ? '+' : ''}${m.delta} pts WA)` : ''));
      });
    }
  }
  linhas.push('', 'A convocatória completa segue em anexo, em PDF.', '', ass);
  return linhas.join('\n');
}

function modalEmail(opts){
  const ativId = opts.ativId;
  const ativ = ativId ? ATIVIDADES.find(a => a.id === ativId) : null;
  const c = ativId ? conv(ativId) : null;
  const guardado = (c && c.email) || {};
  const assuntoPadrao = ativ
    ? `Convocatória ${ativ.id} — ${ativ.nome} (${ativ.datas})`
    : 'Plano de Atividades 2027 — Painel de convocatórias';

  const para = el('input', { type:'text', placeholder:'destinatarios@exemplo.pt, separados por vírgula' });
  para.value = guardado.para || S.cfg.email.para || '';
  const cc = el('input', { type:'text', placeholder:'em cópia (opcional)' });
  cc.value = guardado.cc || S.cfg.email.cc || '';
  const assunto = el('input', { type:'text' });
  assunto.value = guardado.assunto || assuntoPadrao;
  const msg = el('textarea', { rows:14, style:'min-height:230px;font-family:var(--font-b)' });
  msg.value = guardado.mensagem || mensagemEmail(ativId);

  const guardarCampos = () => {
    const dados = { para:para.value.trim(), cc:cc.value.trim(), assunto:assunto.value, mensagem:msg.value };
    if (c) c.email = dados;
    S.cfg.email.para = dados.para; S.cfg.email.cc = dados.cc;
    salvar();
    return dados;
  };

  const abrirCliente = () => {
    const d = guardarCampos();
    const corpo = d.mensagem.length > 1600
      ? d.mensagem.slice(0, 1600) + '\n\n[…] Texto completo copiado para a área de transferência.'
      : d.mensagem;
    if (d.mensagem.length > 1600 && navigator.clipboard) navigator.clipboard.writeText(d.mensagem).catch(() => {});
    const url = 'mailto:' + encodeURIComponent(d.para) +
      '?subject=' + encodeURIComponent(d.assunto) +
      (d.cc ? '&cc=' + encodeURIComponent(d.cc) : '') +
      '&body=' + encodeURIComponent(corpo);
    window.open(url, '_blank');
    toast('Rascunho aberto no seu cliente de e-mail. Anexe o PDF que acabou de guardar.');
  };

  const box = el('div', {},
    el('div', { class:'note warn', style:'margin-bottom:14px' },
      el('b', {}, 'Como funciona: '),
      'por razões de segurança, um navegador não pode anexar ficheiros a um e-mail. A aplicação guarda o PDF no seu computador e abre o rascunho já preenchido no seu programa de e-mail — só falta arrastar o ficheiro para o anexo.'),
    el('div', { class:'grid g2' },
      el('label', { class:'f' }, el('span', {}, 'Para'), para),
      el('label', { class:'f' }, el('span', {}, 'Cc'), cc)),
    el('label', { class:'f', style:'margin-top:10px' }, el('span', {}, 'Assunto'), assunto),
    el('label', { class:'f', style:'margin-top:10px' }, el('span', {}, 'Mensagem'), msg),
    el('div', { style:'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap' },
      el('button', { class:'btn sm', onclick:() => { msg.value = mensagemEmail(ativId); guardarCampos(); toast('Mensagem reposta a partir da convocatória.'); } }, 'Repor mensagem'),
      el('button', { class:'btn sm', onclick:async () => {
        const d = guardarCampos();
        try{ await navigator.clipboard.writeText(d.mensagem); toast('Mensagem copiada.'); }
        catch{ msg.select(); toast('Selecione e copie a mensagem (Ctrl+C).'); }
      } }, 'Copiar mensagem')));

  abrirModal(ativ ? 'Enviar convocatória ' + ativ.id : 'Enviar painel de convocatórias', box, [
    el('button', { class:'btn', onclick:fecharModal }, 'Fechar'),
    el('button', { class:'btn', onclick:async () => {
      guardarCampos();
      toast('A gerar o PDF…');
      if (ativId) await exportarConvPdf(ativId); else await exportarPainelPdf();
    } }, '1 · Guardar PDF'),
    el('button', { class:'btn primary', onclick:abrirCliente }, '2 · Abrir e-mail')]);
}

function guardarEEnviarTudo(){ modalEmail({}); }

<script>
/* ==========================================================================
   RELATÓRIOS — montagem dos conteúdos exportados
   ========================================================================== */
const HOJE = () => new Date().toLocaleDateString('pt-PT', { day:'2-digit', month:'long', year:'numeric' });
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');

function dadosConv(ativId){
  const ativ = ATIVIDADES.find(a => a.id === ativId);
  const c = conv(ativId);
  const sel = SELECOES.find(s => s.id === ativ.sel);
  const linhas = c ? linhasConvocatoria(ativId) : [];
  const ativos = linhas.filter(l => l.estado !== 'removido');
  const removidos = linhas.filter(l => l.estado === 'removido');
  return { ativ, c, sel, linhas, ativos, removidos };
}

const COLS_BASE = ['#','Nadador','Data nasc.','Idade','Género','Clube','Assoc.','Prova de apuramento',
  'Piscina','Tempo','Pts WA','Índice','Δ pts WA','Via','Estado'];
const colsConv = d => d.ativ.tipo === 'Estágio'
  ? [...COLS_BASE, 'Justificação']
  : [...COLS_BASE, 'Provas a inscrever', 'Justificação'];

function linhasTabela(d){
  const estagio = d.ativ.tipo === 'Estágio';
  return d.ativos.map((l, i) => {
    const m = l.melhor;
    const base = [ i+1, l.nome, fmtDate(l.nasc), l.idade ?? '', l.g || '', l.clube || '', l.regiao || '',
      m ? m.ev : (l.detalhe || ''), m ? m.curso : '', m ? fmtTime(m.t) : '',
      m && m.pts != null ? m.pts : '', m && m.idx ? fmtTime(m.idx) : '',
      m && m.delta != null ? (m.delta > 0 ? '+' : '') + m.delta : '',
      l.via || '', l.estado === 'adicionado' ? 'Adicionado (DTN)' : 'Automático' ];
    return estagio ? [...base, l.justificacao || ''] : [...base, (l.provas || []).join(', '), l.justificacao || ''];
  });
}

/* estafetas prontas para as tabelas de saída */
function linhasEstafetas(d){
  return (d.c && d.c.estafetas ? d.c.estafetas : [])
    .filter(e => (e.nadadores || []).some(Boolean))
    .map(e => {
      const nome = k => { const m = d.linhas.find(x => x.key === k); return m ? m.nome : ''; };
      const clube = k => { const m = d.linhas.find(x => x.key === k); return m ? (m.clube || '') : ''; };
      const pernas = pernasEstafeta(e.ev);
      const titulares = (e.nadadores || []).slice(0, 4);
      let soma = 0, completa = true;
      const percursos = titulares.map((k, j) => {
        const rr = k ? melhorEm(k, pernas[j], d.ativ) : null;
        if (rr) soma += rr.t; else completa = false;
        return { n:j + 1, ev:pernas[j], nome: k ? nome(k) : '(por definir)', clube: k ? clube(k) : '',
          tempo: rr ? fmtTime(rr.t) : '—', pts: rr ? String(ptsDe(S.db, rr)) : '—' };
      });
      return {
        prova: rotuloEstafeta(e),
        genero: (GENEROS_EST.find(g => g.id === e.genero) || {}).label || '',
        percursos,
        reservas: (e.nadadores || []).slice(4).filter(Boolean).map(nome).filter(Boolean).join(' · '),
        soma: completa ? fmtTime(soma) : '—',
        nota: e.nota || ''
      };
    });
}

/* pontos livres da convocatória, prontos para as tabelas/blocos de saída */
function blocosInfo(c){
  return (c && c.blocos ? c.blocos : []).filter(b => (b.titulo || '').trim() || (b.conteudo || '').trim());
}
function linhasBloco(b){
  return String(b.conteudo || '').split('\n').map(x => x.trim()).filter(Boolean);
}

/* ---------- Excel ---------- */
function folhaConv(ativId){
  const d = dadosConv(ativId);
  const rows = [colsConv(d), ...linhasTabela(d)];
  if (d.removidos.length){
    rows.push([], ['NADADORES REMOVIDOS DA CONVOCATÓRIA']);
    rows.push(['','Nadador','Data nasc.','Idade','Género','Clube','Assoc.','','','','','','','','Estado','','Justificação']);
    d.removidos.forEach(l => rows.push(['', l.nome, fmtDate(l.nasc), l.idade ?? '', l.g||'', l.clube||'', l.regiao||'',
      '','','','','','','','Removido','', l.justificacao || '']));
  }
  if (d.c && d.c.treinadores && d.c.treinadores.length){
    rows.push([], ['TREINADORES CONVIDADOS'], ['','Clube','Atletas','Treinador']);
    d.c.treinadores.forEach((t, i) => rows.push([i+1, t.clube, t.n, t.nome]));
  }
  const est = linhasEstafetas(d);
  if (est.length){
    rows.push([], ['ESTAFETAS']);
    rows.push(['','Prova','Equipa','#','Percurso','Nadador','Clube','Melhor tempo','Pts WA','Soma dos parciais','Reservas','Observação']);
    est.forEach(e => e.percursos.forEach((p, j) => rows.push(['',
      j === 0 ? e.prova : '', j === 0 ? e.genero : '', p.n, p.ev, p.nome, p.clube, p.tempo, p.pts,
      j === 0 ? e.soma : '', j === 0 ? e.reservas : '', j === 0 ? e.nota : ''])));
  }
  if (incluirNaoConv(ativId)){
    const quase = (resultado(ativId).excluidos || []).slice(0, 40);
    if (quase.length){
      rows.push([], ['CANDIDATOS NÃO CONVOCADOS — DISTÂNCIA AO CRITÉRIO']);
      rows.push(['','Nadador','Data nasc.','Idade','Género','Clube','Assoc.','Melhor prova elegível','Piscina',
        'Tempo','Pts WA','Índice','Δ pts WA','Falta','Falta %','Situação']);
      quase.forEach(x => {
        const m = x.melhor || x.melhorGeral;
        const falta = (m && m.idx != null) ? m.t - m.idx : null;
        rows.push(['', x.nome, fmtDate(x.nasc), x.idade ?? '', x.g || '', x.clube || '', x.regiao || '',
          m ? m.ev : '', m ? m.curso : '', m ? fmtTime(m.t) : '',
          m && m.pts != null ? m.pts : '', m && m.idx ? fmtTime(m.idx) : '',
          m && m.delta != null ? (m.delta > 0 ? '+' : '') + m.delta : '',
          falta != null ? fmtDelta(falta) : '',
          (falta != null && m.idx) ? +(falta / m.idx * 100).toFixed(2) : '',
          x.motivo || '']);
      });
    }
  }
  const info = blocosInfo(d.c);
  if (info.length){
    rows.push([], ['INFORMAÇÕES DA CONVOCATÓRIA']);
    for (const b of info){
      rows.push([], [b.titulo]);
      if (b.tipo === 'tabela') linhasBloco(b).forEach(l => rows.push(['', ...l.split('|').map(x => x.trim())]));
      else linhasBloco(b).forEach(l => rows.push(['', (b.tipo === 'lista' ? '• ' : '') + l]));
    }
  }
  if (d.c && d.c.nota) rows.push([], ['NOTA'], ['', d.c.nota]);
  return { name: ativId, titulo: `${d.ativ.id} · ${d.ativ.nome}`,
    sub: `${d.sel.nome} — ${d.ativ.datas} — ${d.ativ.local} · ${d.ativos.length} nadadores · gerado a ${HOJE()}`,
    rows, widths: d.ativ.tipo === 'Estágio'
      ? [4,30,11,6,7,30,8,18,8,10,8,10,10,16,16,42]
      : [4,30,11,6,7,30,8,18,8,10,8,10,10,16,16,26,42] };
}

/* ---------- Word / PDF ---------- */
function blocosConv(ativId, comCapa){
  const d = dadosConv(ativId);
  const b = [];
  if (comCapa) b.push({ h1:`${d.ativ.id} · ${d.ativ.nome}` });
  else b.push({ h2:`${d.ativ.id} · ${d.ativ.nome}` });
  b.push({ small:`${d.sel.nome} · ${d.ativ.tipo} · ${d.ativ.datas}${d.ativ.aDefinir ? ' (a confirmar)':''} · ${d.ativ.local}` });
  b.push({ small:`Federação Portuguesa de Natação · Plano de Atividades 2027 · PAR Ciclo 2025-2028 · Documento gerado a ${HOJE()}` });
  b.push({ rule:true });
  b.push({ h3:'Critérios de seleção — nadadores' }, { bullets:d.ativ.criterios });
  if (d.ativ.treinadores.length) b.push({ h3:'Critérios de seleção — treinadores convidados' }, { bullets:d.ativ.treinadores });
  if (d.ativ.regra.validadeIni)
    b.push({ small:`Validade dos resultados considerada: ${fmtDate(d.ativ.regra.validadeIni)} a ${fmtDate(d.ativ.regra.validadeFim)}. Piscina: ${(d.ativ.regra.piscina||[]).join(' ou ')}. Idade a ${fmtDate(S.cfg.refIdade)}.` });

  b.push({ h3:`Nadadores convocados (${d.ativos.length})` });
  if (d.ativos.length){
    b.push({ table:{
      head:['#','Nadador','Nasc.','Id.','Clube','Prova','Tempo','Pts','Δ'],
      widths:[3,22,9,4,24,12,9,6,6],
      rows:d.ativos.map((l, i) => { const m = l.melhor; return [
        String(i+1), l.nome, fmtDate(l.nasc), String(l.idade ?? ''), l.clube || '',
        m ? `${m.ev} ${m.curso}` : (l.detalhe || ''), m ? fmtTime(m.t) : '',
        m && m.pts != null ? String(m.pts) : '',
        m && m.delta != null ? (m.delta > 0 ? '+':'') + m.delta : '' ]; })
    }});
  } else b.push({ p:'Sem nadadores convocados.' });

  if (d.ativ.tipo !== 'Estágio'){
    const comProvas = d.ativos.filter(l => (l.provas||[]).length);
    if (comProvas.length){
      b.push({ h3:'Provas a inscrever' });
      b.push({ table:{ head:['Nadador','Provas'], widths:[28,72],
        rows:comProvas.map(l => [l.nome, (l.provas||[]).join(', ')]) } });
    }
  }
  const est = linhasEstafetas(d);
  if (est.length){
    est.forEach(e => {
      b.push({ h3:`Estafeta ${e.prova} — ${e.genero}` });
      b.push({ table:{ head:['#', 'Percurso', 'Nadador', 'Clube', 'Melhor tempo', 'Pts'],
        widths:[4,12,26,26,12,8],
        rows:e.percursos.map(p => [String(p.n), p.ev, p.nome, p.clube, p.tempo, p.pts]) } });
      const rodape = [`Soma dos parciais: ${e.soma}`];
      if (e.reservas) rodape.push(`Reservas: ${e.reservas}`);
      if (e.nota) rodape.push(e.nota);
      b.push({ small: rodape.join(' · ') });
    });
    b.push({ small:'A soma dos parciais resulta dos melhores tempos individuais de cada nadador no percurso indicado e não considera as passagens.' });
  }

  const justificados = d.ativos.filter(l => l.justificacao);
  if (justificados.length){
    b.push({ h3:'Justificações' });
    b.push({ table:{ head:['Nadador','Situação','Justificação'], widths:[24,16,60],
      rows:justificados.map(l => [l.nome, l.estado === 'adicionado' ? 'Adicionado pela DTN':'Convocado', l.justificacao]) } });
  }
  if (d.removidos.length){
    b.push({ h3:'Nadadores removidos da convocatória' });
    b.push({ table:{ head:['Nadador','Clube','Justificação'], widths:[24,26,50],
      rows:d.removidos.map(l => [l.nome, l.clube || '', l.justificacao || '—']) } });
  }
  if (d.c && d.c.treinadores && d.c.treinadores.length){
    b.push({ h3:'Treinadores convidados' });
    b.push({ table:{ head:['#','Treinador','Clube','Atletas'], widths:[5,34,45,12],
      rows:d.c.treinadores.map((t,i) => [String(i+1), t.nome, t.clube, String(t.n)]) } });
  }
  for (const bl of blocosInfo(d.c)){
    b.push({ h3: bl.titulo });
    const linhas = linhasBloco(bl);
    if (!linhas.length) continue;
    if (bl.tipo === 'lista') b.push({ bullets: linhas });
    else if (bl.tipo === 'tabela'){
      const celulas = linhas.map(l => l.split('|').map(x => x.trim()));
      const nCols = Math.max(...celulas.map(x => x.length));
      const norm = celulas.map(x => { const y = x.slice(); while (y.length < nCols) y.push(''); return y; });
      const larg = [];
      for (let j = 0; j < nCols; j++)
        larg[j] = Math.max(6, ...norm.map(f => (f[j] || '').length));   // colunas proporcionais ao conteúdo
      b.push({ table:{ head:norm[0], rows:norm.slice(1), widths:larg } });
    }
    else linhas.forEach(l => b.push({ p:l }));
  }
  if (d.c && d.c.nota) b.push({ h3:'Nota' }, { p:d.c.nota });
  if (d.ativ.observacoes) b.push({ h3:'Observações do Plano de Atividades' }, { small:d.ativ.observacoes });
  if (d.ativ.objetivos && d.ativ.objetivos.length) b.push({ h3:'Objetivos da atividade' }, { bullets:d.ativ.objetivos });

  const r = incluirNaoConv(ativId) ? resultado(ativId) : { excluidos: [] };
  const quase = (r.excluidos || []).slice(0, 20);
  if (quase.length){
    b.push({ h3:'Candidatos não convocados — distância ao critério' });
    b.push({ small:'“Falta” é o tempo que o nadador precisa de melhorar na sua melhor prova elegível para atingir o índice; um valor negativo indica que já o cumpre e que ficou de fora por outro motivo.' });
    b.push({ table:{ head:['Nadador','Clube','Prova','Tempo','Índice','Falta','%','Pts','Situação'],
      widths:[19,17,8,7,7,8,6,5,23],
      rows:quase.map(x => { const m = x.melhor || x.melhorGeral;
        const falta = (m && m.idx != null) ? m.t - m.idx : null;
        return [x.nome, x.clube || '', m ? m.ev : '', m ? fmtTime(m.t) : '',
          m && m.idx ? fmtTime(m.idx) : '', falta != null ? fmtDelta(falta) : '',
          (falta != null && m.idx) ? (falta/m.idx*100).toFixed(1).replace('.', ',') + '%' : '',
          m && m.delta != null ? (m.delta > 0 ? '+':'') + m.delta : '',
          String(x.motivo || '').split(' — ')[0]]; }) } });
  }
  return b;
}

/* ---------- entrega, com alternativa CSV quando o .xlsx nao e aceite ---------- */
const csvCell = x => {
  const s = String(x ?? '');
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function csvDeFolhas(folhas){
  const linhas = [];
  folhas.forEach((f, i) => {
    if (i) linhas.push('');
    linhas.push(csvCell('=== ' + (f.titulo || f.name) + ' ==='));
    if (f.sub) linhas.push(csvCell(f.sub));
    f.rows.forEach(r => linhas.push(r.map(csvCell).join(';')));
  });
  return '\uFEFF' + linhas.join('\r\n');
}
async function entregar(nome, blob, tipo, folhas){
  const alt = [];
  if (tipo === 'xlsx' && folhas && folhas.length)
    alt.push({ filename: nome.replace(/\.xlsx$/, '.csv'), data: csvDeFolhas(folhas) });
  try{
    const r = await guardar(nome, blob, alt);
    toast(`Ficheiro guardado: ${r.filename}`);
  } catch(e){
    if (e && e.code === 'declined') return toast('Descarregamento cancelado.');
    if (e && e.code === 'rate_limited') return toast('Já existe um pedido de descarregamento aberto. Conclua-o e tente de novo.', true);
    toast('Não foi possível guardar o ficheiro: ' + (e.message || e.code || e), true);
  }
}

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
(async function init(){
  try{
    const cfg = await store.get('cfg');
    if (cfg){
      S.cfg = { ...cfgPadrao(), ...cfg };
      S.cfg.indices = cfg.indices && cfg.indices.PL && cfg.indices.PC ? cfg.indices : { PL:clone(IDX_PL), PC:clone(IDX_PC) };
      S.cfg.rankings = { ...cfgPadrao().rankings, ...(cfg.rankings||{}) };
    }
    const db = await store.get('db');
    if (db) S.db = desserializarDb(db);
  } catch(e){ console.warn('Sem armazenamento persistente:', e); }
  pintarNav();
  render();
})();
</script>
