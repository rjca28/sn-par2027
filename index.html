<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Gera, edita e exporta as convocatórias das Seleções Nacionais de Natação Pura a partir do Plano de Atividades 2027 (PAR 2025-2028).">
<title>Convocatórias PAR 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#eef3f7; --surface:#ffffff; --surface-2:#f5f9fb; --surface-3:#e7eff5;
  --ink:#0e2131; --ink-2:#4a6073; --ink-3:#7b93a5;
  --line:#d3e0e9; --line-2:#e6eef4;
  --accent:#0a5f8f; --accent-ink:#084a6f; --accent-soft:#e2eff7;
  --serie-a:#0a5f8f; --serie-b:#c9743a;
  --good:#0f7a52; --good-soft:#e2f2ea;
  --warn:#a06514; --warn-soft:#faf0dd;
  --bad:#b03a2e;  --bad-soft:#fbe8e5;
  --shadow:0 1px 2px rgba(14,33,49,.06), 0 8px 24px -16px rgba(14,33,49,.28);
  --r:9px;
  --font-d:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-b:"Source Sans 3", system-ui, -apple-system, Segoe UI, sans-serif;
  --font-m:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0a1520; --surface:#11202c; --surface-2:#162836; --surface-3:#1d3446;
    --ink:#dce8f1; --ink-2:#9cb3c4; --ink-3:#6c8497;
    --line:#253d52; --line-2:#1b2f40;
    --accent:#64b5e0; --accent-ink:#8dcbee; --accent-soft:#14303f;
    --serie-a:#3d93c4; --serie-b:#c87d3c;
    --good:#4dbc92; --good-soft:#12332a;
    --warn:#d8a854; --warn-soft:#332913;
    --bad:#e5807a;  --bad-soft:#3a1f1d;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0a1520; --surface:#11202c; --surface-2:#162836; --surface-3:#1d3446;
  --ink:#dce8f1; --ink-2:#9cb3c4; --ink-3:#6c8497;
  --line:#253d52; --line-2:#1b2f40;
  --accent:#64b5e0; --accent-ink:#8dcbee; --accent-soft:#14303f;
  --serie-a:#3d93c4; --serie-b:#c87d3c;
  --good:#4dbc92; --good-soft:#12332a;
  --warn:#d8a854; --warn-soft:#332913;
  --bad:#e5807a;  --bad-soft:#3a1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-b);
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand .lanes{display:flex;gap:2px;margin-bottom:11px}
.brand .lanes i{height:3px;flex:1;border-radius:2px;background:var(--accent);opacity:.22}
.brand .lanes i:nth-child(2){opacity:.42}.brand .lanes i:nth-child(3){opacity:.66}
.brand .lanes i:nth-child(4){opacity:.9}
.brand h1{font-size:18px;line-height:1.1;font-weight:700;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3);font-family:var(--font-d);
  text-transform:uppercase;letter-spacing:.09em}
nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-family:var(--font-d);
  font-size:15px;font-weight:600;letter-spacing:.01em}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink)}
nav button svg{width:16px;height:16px;flex:none;opacity:.85}
nav .count{margin-left:auto;font-family:var(--font-m);font-size:11px;color:var(--ink-3)}
.rail-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.rail-foot b{display:block;color:var(--ink-2);font-weight:600;font-size:12px;word-break:break-word}

main{min-width:0;padding:0 0 60px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 26px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:20px;font-weight:700}
.topbar .sp{flex:1}
.wrap{padding:22px 24px;max-width:1460px}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer;font-family:var(--font-d);
  font-size:14px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 7px;font-size:12.5px}
.btn svg{width:14px;height:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card{margin-top:18px}
.card>header{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>header h3{font-size:16px;font-weight:700}
.card>header .sp{flex:1}
.card .body{padding:16px 18px}
.card .body.tight{padding:0}

.eyebrow{font-family:var(--font-d);font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.11em;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-d);font-size:12px;font-weight:600;
  padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.est{background:var(--warn-soft);color:var(--warn)}
.pill.comp{background:var(--accent-soft);color:var(--accent-ink)}

.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--font-d);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);
  background:var(--surface-2);position:sticky;top:0;white-space:nowrap;z-index:1}
td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.just{max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:hover td{background:var(--surface-2)}
tr.removido td{opacity:.5}
tr.removido td .nome{text-decoration:line-through}
td.num,th.num{text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.nome{font-weight:600}

/* barra divergente de pontos */
.dbar{position:relative;height:15px;width:54px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.dbar i{position:absolute;top:2px;height:12px;border-radius:2px}
.dbar u{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line);opacity:.9}

/* formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
label.f>span{font-family:var(--font-d);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13.5px;width:100%}
textarea{resize:vertical;min-height:56px;font-family:var(--font-b)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);
  border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-family:var(--font-d);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--font-d);font-size:31px;font-weight:700;line-height:1;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.kpi .l{margin-top:5px;font-size:12px;color:var(--ink-3);font-family:var(--font-d);
  text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .s{margin-top:2px;font-size:12px;color:var(--ink-2)}

/* gráfico de barras */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lb{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--surface-3);border-radius:4px;height:14px;overflow:hidden;display:flex;gap:2px}
.bar .tr i{height:14px;border-radius:0 4px 4px 0;display:block;min-width:2px}
.bar .vv{font-family:var(--font-m);font-size:12px;color:var(--ink-2);min-width:30px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* lista de atividades */
.actgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.act{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.act:hover{border-color:var(--accent)}
.act .r1{display:flex;align-items:center;gap:7px}
.act .cod{font-family:var(--font-m);font-size:11.5px;color:var(--ink-3)}
.act h4{font-size:15.5px;font-weight:600;line-height:1.25}
.act .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.act .foot{display:flex;align-items:center;gap:8px;margin-top:2px;padding-top:8px;border-top:1px solid var(--line-2)}

/* blocos de informação */
.blocos{display:flex;flex-direction:column;gap:12px}
.bloco{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.bloco-top{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.bloco-top input[type=text]{flex:1;min-width:170px;font-weight:600}
.bloco-top select{width:auto;min-width:150px}
.bloco-n{width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:5px;
  background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:600}
.bloco textarea{background:var(--surface);font-size:13.5px;line-height:1.5}

.fich{display:flex;flex-direction:column;gap:8px}
.fich-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-2)}
.fich-n{width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:5px;
  background:var(--surface-3);color:var(--ink-2);font-size:11px}
.card>header .grupo-btn{display:flex;gap:8px;flex-wrap:wrap}
label.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--ink-2)}
label.switch span{font-family:var(--font-d);font-weight:600}

/* editor de tabela */
.tabela-ed{background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden}
table.grelha{font-size:13px}
table.grelha th{padding:5px 6px;background:var(--surface-3);text-transform:none;letter-spacing:0;
  font-size:12px;position:static}
table.grelha td{padding:3px 6px;border-bottom:1px solid var(--line-2)}
table.grelha input{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:5px;
  width:auto;min-width:70px;max-width:340px;font-size:13px}
table.grelha th input{font-family:var(--font-d);font-weight:600;color:var(--ink-2)}
table.grelha input:hover{border-color:var(--line)}
table.grelha input:focus{border-color:var(--accent);background:var(--surface);outline:none}
table.grelha .gnum{width:26px;text-align:center;padding:3px 2px;font-size:11px}
table.grelha tbody tr:hover td{background:transparent}
.gcol{display:flex;align-items:center;gap:2px}
.gx{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;
  padding:2px 5px;border-radius:4px}
.gx:hover{background:var(--bad-soft);color:var(--bad)}
.tabela-btns{display:flex;gap:7px;padding:8px 9px;border-top:1px solid var(--line-2);
  background:var(--surface-2);flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(8,20,30,.55)}
.modal.on{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);
  max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{font-size:17px;font-weight:700}
.modal .content{padding:16px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.18s;max-width:min(560px,92vw);box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad);color:#fff}

/* estado vazio */
.empty{text-align:center;padding:54px 20px;color:var(--ink-3)}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;background:var(--surface-2);
  transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;
  padding:10px 14px;font-size:13px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn)}
ul.crit{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
ul.crit li{margin:4px 0}
ul.crit b{color:var(--ink)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:2px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;
  font-family:var(--font-d);font-size:14.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;flex-wrap:wrap}
  nav button{width:auto}
  .rail-foot{display:none}
  .wrap,.topbar{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="lanes"><i></i><i></i><i></i><i></i></div>
      <h1>Convocatórias PAR</h1>
      <p>FPN · Natação Pura · 2027</p>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main>
    <div class="topbar">
      <h2 id="pgTitle">Painel</h2>
      <div class="sp"></div>
      <div id="pgActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <header><h3 id="mTitle"></h3><div class="sp" style="flex:1"></div>
      <button class="btn ghost sm" onclick="fecharModal()">Fechar</button></header>
    <div class="content" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".xlsx" hidden>
<script>
/* ==========================================================================
   PAR 2027 — Base de conhecimento
   Transcrição do "Plano de Atividades 2027 — Seleções Nacionais · Natação Pura"
   FPN · PAR Ciclo 2025-2028 · Versão 1.0 (setembro de 2026)
   ========================================================================== */

const EV_PL = ['50 Liv','100 Liv','200 Liv','400 Liv','800 Liv','1500 Liv',
               '50 Cos','100 Cos','200 Cos','50 Bru','100 Bru','200 Bru',
               '50 Mar','100 Mar','200 Mar','200 Est','400 Est'];

const EV_PC = ['50 Liv','100 Liv','200 Liv','400 Liv','800 Liv','1500 Liv',
               '50 Cos','100 Cos','200 Cos','50 Bru','100 Bru','200 Bru',
               '50 Mar','100 Mar','200 Mar','100 Est','200 Est','400 Est'];

/* --- Níveis de índice: nome interno -> rótulo e n.º de índice do PAR Geral --- */
const NIVEIS = {
  SEN_A:    { label:'SEN A',     num:4,  grupo:'SEN',   ordem:1  },
  SEN_B:    { label:'SEN B',     num:6,  grupo:'SEN',   ordem:2  },
  SEN_C:    { label:'SEN C',     num:8,  grupo:'SEN',   ordem:3  },
  SUB23_A:  { label:'SUB23 A',   num:7,  grupo:'SUB23', ordem:4  },
  SUB23_B:  { label:'SUB23 B',   num:9,  grupo:'SUB23', ordem:5  },
  SUB23_C:  { label:'SUB23 C',   num:11, grupo:'SUB23', ordem:6  },
  PA_SUB23: { label:'PA-SUB23',  num:13, grupo:'PA',    ordem:7  },
  JUN_A:    { label:'JUN A',     num:15, grupo:'JUN',   ordem:8  },
  JUN_B:    { label:'JUN B',     num:17, grupo:'JUN',   ordem:9  },
  JUN_C:    { label:'JUN C',     num:19, grupo:'JUN',   ordem:10 },
  PA_JUN:   { label:'PA-JUN',    num:20, grupo:'PA',    ordem:11 },
  JOV_A:    { label:'JOV A',     num:21, grupo:'JOV',   ordem:12 },
  JOV_B:    { label:'JOV B',     num:23, grupo:'JOV',   ordem:13 },
  JOV_C:    { label:'JOV C',     num:25, grupo:'JOV',   ordem:14 },
  PA_JOV:   { label:'PA-JOV',    num:27, grupo:'PA',    ordem:15 }
};

/* Escalões etários a que cada nível de índice se aplica (idade no ano de referência) */
const FAIXA_NIVEL = {
  SEN_A:[19,99], SEN_B:[19,99], SEN_C:[19,99],
  SUB23_A:[0,22], SUB23_B:[0,22], SUB23_C:[0,22],
  PA_SUB23:[19,22], PA_JUN:[17,18], PA_JOV:[15,16],
  JUN_A:[15,18], JUN_B:[15,18], JUN_C:[15,18],
  JOV_A:[14,16], JOV_B:[14,16], JOV_C:[14,16]

<script>
/* ==========================================================================
   MOTOR — tempos, pontuação World Aquatics, leitura de XLSX e seleção
   ========================================================================== */

/* ---------- tempo ---------- */
function parseTime(v){
  if (v == null) return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(',', '.');
  if (!s || /^(NT|DNS|DSQ|DNF)$/i.test(s)) return null;
  const p = s.split(':').map(Number);
  if (p.some(isNaN)) return null;
  if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  if (p.length === 2) return p[0]*60 + p[1];
  return p[0];
}
function fmtTime(sec){
  if (sec == null || !isFinite(sec)) return '—';
  const cs = Math.round(sec*100);
  const m = Math.floor(cs/6000), s = Math.floor((cs%6000)/100), c = cs%100;
  const cc = String(c).padStart(2,'0');
  return m > 0 ? `${m}:${String(s).padStart(2,'0')},${cc}` : `${s},${cc}`;
}
function fmtDelta(sec){
  if (sec == null || !isFinite(sec)) return '—';
  const s = Math.abs(sec), sinal = sec >= 0 ? '+' : '−';
  if (s >= 60) return sinal + fmtTime(s);
  return sinal + s.toFixed(2).replace('.', ',') + ' s';
}
function dataLonga(iso){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d = iso ? new Date(iso) : null;
  if (!d || isNaN(d)) return '';
  return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}
function fmtDate(d){
  if (!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return '—';
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}
function toDate(v){
  if (!v) return null;
  if (v instanceof Date) return v;
  if (typeof v === 'number') return new Date(Date.UTC(1899,11,30) - 0 + v*86400000);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ---------- pontuação World Aquatics ---------- */
function waPts(base, t){
  if (!base || !t) return null;
  return Math.floor(1000 * Math.pow(base/t, 3));
}
function baseKey(course, g, dist, stroke){ return `${course}|${g}|${dist}|${stroke}`; }

/* ---------- leitura de XLSX (ZIP + SpreadsheetML, sem bibliotecas) ---------- */
async function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined')
    throw new Error('O navegador não suporta descompressão nativa. Use uma versão recente do Chrome, Edge, Safari ou Firefox.');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  // localizar End of Central Directory
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Ficheiro inválido: não parece ser um .xlsx.');
  const nEntries = dv.getUint16(eocd+10, true);
  let off = dv.getUint32(eocd+16, true);
  const files = {};
  for (let i = 0; i < nEntries; i++){
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off+10, true);
    const csize  = dv.getUint32(off+20, true);
    const nameLen= dv.getUint16(off+28, true);
    const extLen = dv.getUint16(off+30, true);
    const cmtLen = dv.getUint16(off+32, true);
    const lho    = dv.getUint32(off+42, true);
    const name   = new TextDecoder().decode(u8.subarray(off+46, off+46+nameLen));
    const lNameLen = dv.getUint16(lho+26, true);
    const lExtLen  = dv.getUint16(lho+28, true);
    const dataOff  = lho + 30 + lNameLen + lExtLen;
    files[name] = { method, data: u8.subarray(dataOff, dataOff + csize) };
    off += 46 + nameLen + extLen + cmtLen;
  }
  const out = {};
  for (const [name, f] of Object.entries(files)){
    if (!/\.(xml|rels)$/i.test(name)) continue;
    const raw = f.method === 0 ? f.data : await inflateRaw(f.data);
    out[name] = new TextDecoder('utf-8').decode(raw);
  }
  return out;
}

function xmlDoc(s){ return new DOMParser().parseFromString(s, 'application/xml'); }

function colToNum(ref){
  let n = 0;
  for (const ch of ref){
    const c = ch.charCodeAt(0);
    if (c < 65 || c > 90) break;
    n = n*26 + (c - 64);
  }
  return n - 1;
}

async function parseXlsx(arrayBuffer){
  const zip = await readZip(arrayBuffer);
  // strings partilhadas
  let shared = [];
  if (zip['xl/sharedStrings.xml']){
    const d = xmlDoc(zip['xl/sharedStrings.xml']);
    shared = Array.from(d.getElementsByTagName('si')).map(si => {
      const ts = si.getElementsByTagName('t');
      let s = '';
      for (const t of ts) s += t.textContent;
      return s;
    });
  }
  // nomes e destinos das folhas
  const wb = xmlDoc(zip['xl/workbook.xml']);
  const relsXml = zip['xl/_rels/workbook.xml.rels'];
  const rels = {};
  if (relsXml){
    for (const r of xmlDoc(relsXml).getElementsByTagName('Relationship'))
      rels[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//,'').replace(/^\//,'');
  }
  const sheets = [];
  for (const sh of wb.getElementsByTagName('sheet')){
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const target = rels[rid];
    if (target) sheets.push({ name: sh.getAttribute('name'), path: 'xl/' + target });
  }
  // formatos de data
  const dateStyles = new Set();
  if (zip['xl/styles.xml']){
    const st = xmlDoc(zip['xl/styles.xml']);
    const custom = {};
    for (const nf of st.getElementsByTagName('numFmt')){
      const code = nf.getAttribute('formatCode') || '';
      if (/[dmyDMY]/.test(code) && !/[hH]/.test(code.replace(/\[[^\]]*\]/g,''))) custom[nf.getAttribute('numFmtId')] = true;
    }
    const xfs = st.getElementsByTagName('cellXfs')[0];
    if (xfs){
      Array.from(xfs.getElementsByTagName('xf')).forEach((xf, i) => {
        const id = xf.getAttribute('numFmtId');
        if (custom[id] || (id >= 14 && id <= 22) || (id >= 45 && id <= 47)) dateStyles.add(i);
      });
    }
  }
  const result = [];
  for (const sh of sheets){
    const xml = zip[sh.path];
    if (!xml) continue;
    const d = xmlDoc(xml);
    const rows = [];
    for (const row of d.getElementsByTagName('row')){
      const arr = [];
      for (const c of row.getElementsByTagName('c')){
        const ref = c.getAttribute('r') || '';
        const idx = ref ? colToNum(ref) : arr.length;
        const t = c.getAttribute('t');
        const sIdx = c.getAttribute('s');
        let val = null;
        if (t === 'inlineStr'){
          const is = c.getElementsByTagName('t');
          val = Array.from(is).map(x => x.textContent).join('');
        } else {
          const v = c.getElementsByTagName('v')[0];
          if (v){
            if (t === 's') val = shared[+v.textContent] ?? '';
            else if (t === 'str' || t === 'e') val = v.textContent;
            else {
              const num = parseFloat(v.textContent);
              val = (sIdx != null && dateStyles.has(+sIdx) && isFinite(num))
                ? new Date(Date.UTC(1899,11,30) + Math.round(num)*86400000)
                : num;
            }
          }
        }
        arr[idx] = val;
      }
      rows.push(arr);
    }
    result.push({ name: sh.name, rows });
  }
  return result;
}

/* ---------- construção da base de dados a partir das folhas ---------- */
const STROKE_MAP = { 'liv':'Liv','livres':'Liv','free':'Liv','cos':'Cos','costas':'Cos','back':'Cos',
  'bru':'Bru','bruços':'Bru','brucos':'Bru','breast':'Bru','mar':'Mar','mariposa':'Mar','fly':'Mar',
  'est':'Est','estilos':'Est','medley':'Est','im':'Est' };

function normStroke(s){
  if (!s) return null;
  const k = String(s).trim().toLowerCase();
  return STROKE_MAP[k] || (k.charAt(0).toUpperCase() + k.slice(1,3));
}

function buildDb(sheets, fileName){
  const HEAD = ['COURSE','GENDER','DISTANCE','STROKE','FULLNAME','BIRTHDATE','NATION','CLUBCODE',
                'SWIMTIME','SWIMTIME_N','PTS_FINA','PTS_RUDOLPH','PLACE','MEETDATE','MEETCITY',
                'MEETNAME','CLUBNAME','REGION'];
  const res = [];
  let periodo = '', avisos = [];
  for (const sh of sheets){
    // procurar a linha de cabeçalho nas primeiras 8 linhas
    let hRow = -1, map = {};
    for (let i = 0; i < Math.min(8, sh.rows.length); i++){
      const r = sh.rows[i] || [];
      const found = {};
      r.forEach((v, j) => { const k = String(v||'').trim().toUpperCase(); if (HEAD.includes(k)) found[k] = j; });
      if (found.FULLNAME != null && found.SWIMTIME != null && found.DISTANCE != null){ hRow = i; map = found; break; }
      if (i === 0 && r[0] && !periodo) periodo = String(r[0]);
    }
    if (hRow < 0){ avisos.push(`Folha "${sh.name}" ignorada: cabeçalho não reconhecido.`); continue; }
    const ehLap = /\bLap\b/i.test(sh.name);
    for (let i = hRow+1; i < sh.rows.length; i++){
      const r = sh.rows[i]; if (!r) continue;
      const nome = r[map.FULLNAME]; if (!nome) continue;
      const dist = r[map.DISTANCE]; const stroke = normStroke(r[map.STROKE]);
      if (!dist || !stroke) continue;
      const distStr = String(dist).trim();
      if (/^4\s*x/i.test(distStr)) continue;                       // estafetas: fora dos índices
      const nasc = toDate(r[map.BIRTHDATE]); if (!nasc) continue;   // sem data de nascimento não há escalão
      const t = (map.SWIMTIME_N != null && typeof r[map.SWIMTIME_N] === 'number')
        ? r[map.SWIMTIME_N] : parseTime(r[map.SWIMTIME]);
      if (!t) continue;
      const courseRaw = String(r[map.COURSE]||'').trim().toUpperCase();
      res.push({
        curso: courseRaw === 'SCM' ? 'PC' : 'PL',
        g: String(r[map.GENDER]||'').trim().toUpperCase().startsWith('F') ? 'F' : 'M',
        dist: distStr, stroke,
        ev: `${distStr} ${stroke}`,
        nome: String(nome).trim(),
        nasc,
        nation: String(r[map.NATION]||'').trim().toUpperCase(),
        clubeCod: String(r[map.CLUBCODE]||'').trim(),
        clube: String(r[map.CLUBNAME]||r[map.CLUBCODE]||'').trim(),
        regiao: String(r[map.REGION]||'').trim(),
        t, lap: ehLap, ptsFich: (typeof r[map.PTS_FINA] === 'number' ? r[map.PTS_FINA] : null),
        prova: String(r[map.MEETNAME]||'').trim(),
        cidade: String(r[map.MEETCITY]||'').trim(),
        data: toDate(r[map.MEETDATE])
      });
    }
  }
  // remover duplicados exatos (folhas com sobreposição, ex.: "Top Results")
  const seen = new Set(), lim = [];
  for (const r of res){
    const k = `${r.nome}|${+r.nasc}|${r.curso}|${r.ev}|${r.t}|${r.data ? +r.data : 0}|${r.lap ? 1 : 0}`;
    if (seen.has(k)) continue;
    seen.add(k); lim.push(r);
  }
  /* Tempos-base World Aquatics deduzidos dos próprios dados.
     As folhas de tempos de percurso ("Lap") usam outra referência, por isso
     ficam de fora da dedução. Usa-se a moda (valor mais repetido) e não a
     média, para não ser afetada por linhas com pontuação inconsistente. */
  const acc = {};
  for (const r of lim){
    if (r.lap || !r.ptsFich || !r.t) continue;
    const k = baseKey(r.curso === 'PC' ? 'SCM' : 'LCM', r.g, r.dist, r.stroke);
    (acc[k] = acc[k] || []).push(r.t * Math.pow(r.ptsFich/1000, 1/3));
  }
  const bases = {};
  for (const [k, v] of Object.entries(acc)){
    const cont = {};
    for (const x of v){ const b = Math.round(x*10)/10; cont[b] = (cont[b]||0) + 1; }
    const moda = +Object.entries(cont).sort((a,b) => b[1]-a[1])[0][0];
    const perto = v.filter(x => Math.abs(x - moda) <= 0.06 * Math.max(1, moda/20)).sort((a,b) => a-b);
    const fonte = perto.length ? perto : v.slice().sort((a,b) => a-b);
    bases[k] = +(fonte[Math.floor(fonte.length/2)]).toFixed(2);
  }
  for (const [k, v] of Object.entries(BASE_FALLBACK)) if (bases[k] == null) bases[k] = v;

  // nadadores
  const nad = new Map();
  for (const r of lim){
    const key = `${r.nome}|${r.nasc.getFullYear()}-${r.nasc.getMonth()+1}-${r.nasc.getDate()}`;
    let n = nad.get(key);
    if (!n){ n = { key, nome:r.nome, nasc:r.nasc, g:r.g, nation:r.nation, clube:r.clube,
                   clubeCod:r.clubeCod, regiao:r.regiao, res:[] }; nad.set(key, n); }
    if (r.data && (!n.ultima || r.data > n.ultima)){ n.ultima = r.data; n.clube = r.clube; n.regiao = r.regiao; n.clubeCod = r.clubeCod; }
    n.res.push(r);
  }
  return { resultados: lim, nadadores: nad, bases, periodo, ficheiro: fileName,
           importadoEm: new Date().toISOString(), avisos,
           cursos: [...new Set(lim.map(r => r.curso))] };
}

/* ---------- juntar um novo ficheiro de rankings ao existente ---------- */
function mergeDb(atual, novo){
  const chave = r => `${r.nome}|${+r.nasc}|${r.curso}|${r.ev}|${r.t}|${r.data ? +r.data : 0}|${r.lap ? 1 : 0}`;
  const vistos = new Set(atual.resultados.map(chave));
  const juntos = atual.resultados.slice();
  let novos = 0;
  for (const r of novo.resultados){ const k = chave(r); if (vistos.has(k)) continue; vistos.add(k); juntos.push(r); novos++; }

  const bases = { ...atual.bases };
  for (const [k, v] of Object.entries(novo.bases)) bases[k] = v;   // o ficheiro mais recente manda

  const nad = new Map();
  for (const r of juntos){
    const key = `${r.nome}|${r.nasc.getFullYear()}-${r.nasc.getMonth()+1}-${r.nasc.getDate()}`;
    let n = nad.get(key);
    if (!n){ n = { key, nome:r.nome, nasc:r.nasc, g:r.g, nation:r.nation, clube:r.clube,
                   clubeCod:r.clubeCod, regiao:r.regiao, res:[] }; nad.set(key, n); }
    if (r.data && (!n.ultima || r.data > n.ultima)){ n.ultima = r.data; n.clube = r.clube; n.regiao = r.regiao; n.clubeCod = r.clubeCod; }
    n.res.push(r);
  }
  const ficheiros = (atual.ficheiros || [{ nome:atual.ficheiro, em:atual.importadoEm, n:atual.resultados.length }])
    .concat([{ nome:novo.ficheiro, em:novo.importadoEm, n:novos }]);
  return { resultados:juntos, nadadores:nad, bases,
    periodo: novo.periodo || atual.periodo, ficheiro: novo.ficheiro,
    importadoEm: novo.importadoEm, avisos: novo.avisos, ficheiros,
    novosResultados: novos,
    cursos: [...new Set(juntos.map(r => r.curso))] };
}

/* ---------- índices ---------- */
function idxTime(indices, curso, nivel, g, ev){
  if (curso === 'PL'){
    const i = EV_PL.indexOf(ev);
    if (i < 0) return null;
    const tab = indices.PL[nivel]; if (!tab) return null;
    return parseTime(tab[g][i]);
  }
  const num = NIVEIS[nivel] && NIVEIS[nivel].num;
  const col = IDX_PC_NUMS.indexOf(num);
  if (col < 0) return null;
  const row = indices.PC[g] && indices.PC[g][ev];
  return row ? parseTime(row[col]) : null;
}

function idadeEm(nasc, refISO){
  const ref = new Date(refISO);
  return ref.getFullYear() - nasc.getFullYear();  // idade a 31 de dezembro do ano de referência
}

function ptsDe(db, r){
  const p = waPts(db.bases[baseKey(r.curso === 'PC' ? 'SCM' : 'LCM', r.g, r.dist, r.stroke)], r.t);
  return p != null ? p : (r.ptsFich || null);
}

/* nome normalizado para comparação (a lista da Seleção Elite vem em texto corrido) */
function tokensNome(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z ]/g,' ').split(/\s+/).filter(x => x.length > 1).sort();
}
function acharNadador(db, nome){
  if (!db || !db.nadadores) return null;
  const a = tokensNome(nome).join(' ');
  for (const n of db.nadadores.values()) if (tokensNome(n.nome).join(' ') === a) return n;
  const set = new Set(tokensNome(nome));
  let melhor = null, melhorN = 0;
  for (const n of db.nadadores.values()){
    const t = tokensNome(n.nome);
    const c = t.filter(x => set.has(x)).length;
    if (c >= 3 && c > melhorN){ melhorN = c; melhor = n; }
  }
  return melhor;
}
function melhoresProvas(db, n){
  const best = {};
  for (const r of n.res){
    const k = r.ev + '|' + r.curso;
    if (!best[k] || r.t < best[k].t) best[k] = { ev:r.ev, curso:r.curso, t:r.t, pts:ptsDe(db, r),
      data:r.data, prova:r.prova, idx:null, idxPts:null, delta:null, ok:false };
  }
  return Object.values(best).sort((a,b) => (b.pts||0) - (a.pts||0));
}

/* ---------- avaliação de uma atividade ---------- */
function avaliar(ativ, db, cfg){
  const regra = ativ.regra || {};
  const out = { atividade: ativ, apurados: [], excluidos: [], porProva: {}, nota: '' };
  if (!db || !db.nadadores) return out;

  if (regra.modo === 'nominal'){
    out.apurados = ELITE.map((e, i) => {
      const n = acharNadador(db, e.nome);
      const provas = n ? melhoresProvas(db, n) : [];
      return { key: n ? n.key : 'elite-' + i, nome: n ? n.nome : e.nome,
        nasc: n ? n.nasc : null, g: n ? n.g : null,
        idade: n ? idadeEm(n.nasc, cfg.refIdade) : null,
        clube: n ? n.clube : '—', regiao: n ? n.regiao : '—',
        via:'Nominal', detalhe:`${e.bolsa} · ${e.estatuto}`,
        melhor: provas[0] || null, delta:null, pts: provas[0] ? provas[0].pts : null,
        provas, comIndice:[] };
    });
    return out;
  }

  const provasReg = cfg.provasRegulamento && cfg.provasRegulamento[ativ.id];
  const inWindow = d => {
    if (!d) return false;
    if (regra.validadeIni && d < new Date(regra.validadeIni)) return false;
    if (regra.validadeFim && d > new Date(regra.validadeFim)) return false;
    return true;
  };
  const cursosOk = regra.piscina || ['PL'];

  if (regra.modo === 'ranking'){
    const conf = cfg.rankings[regra.ranking];
    const linhas = [];
    for (const n of db.nadadores.values()){
      if (cfg.apenasPOR && n.nation && n.nation !== 'POR') continue;
      const idade = idadeEm(n.nasc, cfg.refIdade);
      const q = regra.quotas.find(x => x.genero === n.g && x.idade === idade);
      if (!q) continue;
      const best = {};
      for (const r of n.res){
        if (!cursosOk.includes(r.curso)) continue;
        if (!inWindow(r.data)) continue;
        if (!conf.provas.includes(r.ev)) continue;
        const p = ptsDe(db, r);
        if (p && (!best[r.ev] || p > best[r.ev].p)) best[r.ev] = { p, r };
      }
      const vals = Object.values(best);
      if (!vals.length) continue;
      let score, usadas;
      if (conf.metodo === 'soma'){
        vals.sort((a,b) => b.p - a.p);
        usadas = vals.slice(0, conf.nProvas || vals.length);
        score = usadas.reduce((s,x) => s + x.p, 0);
      } else {
        vals.sort((a,b) => b.p - a.p);
        usadas = [vals[0]]; score = vals[0].p;
      }
      linhas.push({ key:n.key, nome:n.nome, nasc:n.nasc, g:n.g, idade, clube:n.clube, regiao:n.regiao,
        pts:score, delta:null, via:'Ranking',
        detalhe: usadas.map(x => `${x.r.ev} ${fmtTime(x.r.t)} (${x.p}p)`).join(' · '),
        provas: vals.map(x => ({ ev:x.r.ev, t:x.r.t, pts:x.p, curso:x.r.curso, data:x.r.data, prova:x.r.prova, idx:null, delta:null })),
        _quota:`${n.g}${idade}` });
    }
    const grupos = {};
    for (const l of linhas) (grupos[l._quota] = grupos[l._quota] || []).push(l);
    for (const q of regra.quotas){
      const g = (grupos[`${q.genero}${q.idade}`] || []).sort((a,b) => b.pts - a.pts);
      g.forEach((l, i) => { l.posicao = i+1; });
      out.apurados.push(...g.slice(0, q.n));
      out.excluidos.push(...g.slice(q.n).map(l => ({ ...l, motivo:`Fora dos ${q.n} melhores do ranking (${q.genero}, ${q.idade} anos)` })));
    }
    out.apurados.sort((a,b) => a.g.localeCompare(b.g) || a.idade - b.idade || a.posicao - b.posicao);
    return out;
  }

  /* --- modo índice --- */
  const cands = [];
  for (const n of db.nadadores.values()){
    if (cfg.apenasPOR && n.nation && n.nation !== 'POR') continue;
    const idade = idadeEm(n.nasc, cfg.refIdade);
    let faixa = (regra.faixas||[]).find(f => idade >= f.min && idade <= f.max);
    if (regra.semIndice){
      if (regra.idadeMin != null && (idade < regra.idadeMin || idade > regra.idadeMax)) continue;
      faixa = null;
    } else if (!faixa) continue;

    const provas = [];
    for (const r of n.res){
      if (!cursosOk.includes(r.curso)) continue;
      if (r.lap && !cfg.incluirLap) continue;
      if (!inWindow(r.data)) continue;
      if (regra.apenasProvasRegulamento && provasReg && provasReg.length && !provasReg.includes(r.ev)) continue;
      const p = ptsDe(db, r);
      let it = null, ip = null, ok = false;
      if (faixa){
        it = idxTime(cfg.indices, r.curso, faixa.nivel, r.g, r.ev);
        if (it){
          ip = waPts(db.bases[baseKey(r.curso === 'PC' ? 'SCM' : 'LCM', r.g, r.dist, r.stroke)], it);
          ok = r.t <= it + 1e-9;
        }
      }
      const ex = provas.find(x => x.ev === r.ev && x.curso === r.curso);
      const cand = { ev:r.ev, curso:r.curso, t:r.t, pts:p, idx:it, idxPts:ip,
                     delta:(p != null && ip != null) ? p - ip : null, ok,
                     data:r.data, prova:r.prova, cidade:r.cidade };
      if (ex){ if (cand.t < ex.t) Object.assign(ex, cand); }
      else provas.push(cand);
    }
    const comIndice = provas.filter(p => p.ok);
    const melhor = comIndice.slice().sort((a,b) => (b.delta ?? -1e9) - (a.delta ?? -1e9))[0];
    const melhorGeral = provas.slice().sort((a,b) => (b.pts||0) - (a.pts||0))[0];
    cands.push({ key:n.key, nome:n.nome, nasc:n.nasc, g:n.g, idade, clube:n.clube, clubeCod:n.clubeCod,
      regiao:n.regiao, nivel: faixa ? faixa.nivel : null, provas, comIndice,
      melhor, melhorGeral, delta: melhor ? melhor.delta : null,
      pts: melhor ? melhor.pts : (melhorGeral ? melhorGeral.pts : null) });
  }

  /* exclusão por cumprir índices de seleções superiores (Promessas Aquáticas) */
  const excluirSup = regra.excluirSuperior || [];
  const cumpreSuperior = c => {
    for (const grp of excluirSup){
      let nivel = null;
      if (grp === 'JOV' && c.idade >= 14 && c.idade <= 16) nivel = 'JOV_C';
      if (grp === 'JUN' && c.idade >= 15 && c.idade <= 18) nivel = 'JUN_C';
      if (grp === 'SUB23' && c.idade <= 22) nivel = 'SUB23_C';
      if (!nivel) continue;
      for (const p of c.provas){
        const it = idxTime(cfg.indices, p.curso, nivel, c.g, p.ev);
        if (it && p.t <= it) return NIVEIS[nivel].label;
      }
    }
    return null;
  };

  /* melhor aproximação ao índice, para quem não o cumpre */
  for (const c of cands){
    const comIdx = c.provas.filter(p => p.idx != null && p.delta != null);
    c.perto = comIdx.sort((a,b) => b.delta - a.delta)[0] || null;
    if (c.perto) { c.falta = c.perto.t - c.perto.idx; c.faltaPct = c.falta / c.perto.idx * 100; }
  }
  const naoCumprem = cands.filter(c => !c.melhor && c.perto)
    .sort((a,b) => b.perto.delta - a.perto.delta).slice(0, 60)
    .map(c => ({ ...c, via:'—', melhor:c.perto, delta:c.perto.delta,
      motivo:`Não cumpre o índice — falta ${fmtDelta(c.falta)} (${c.faltaPct.toFixed(1)}%) em ${c.perto.ev}` }));

  let elegiveis = [];
  for (const c of cands){
    if (regra.semIndice) continue;   // sem índice: a lista é construída só pelos critérios adicionais
    if (!c.melhor){ continue; }
    const sup = cumpreSuperior(c);
    if (sup){ out.excluidos.push({ ...c, via:'Índice', motivo:`Cumpre o índice ${sup} — não convocável para esta seleção` }); continue; }
    elegiveis.push({ ...c, via:'Índice' });
  }
  elegiveis.sort((a,b) => (b.delta ?? -1e9) - (a.delta ?? -1e9));

  /* máximo de nadadores por prova */
  let selecionados;
  if (regra.maxPorProva){
    const porProva = {};
    for (const c of elegiveis) for (const p of c.comIndice){
      const k = `${p.ev}|${c.g}`;
      (porProva[k] = porProva[k] || []).push({ c, p });
    }
    const keep = new Set();
    for (const [k, arr] of Object.entries(porProva)){
      arr.sort((a,b) => (b.p.delta ?? -1e9) - (a.p.delta ?? -1e9));
      out.porProva[k] = arr.slice(0, regra.maxPorProva).map(x => x.c.nome);
      arr.slice(0, regra.maxPorProva).forEach(x => keep.add(x.c.key));
      arr.slice(regra.maxPorProva).forEach(x => {
        if (!keep.has(x.c.key)) out.excluidos.push({ ...x.c, via:'Índice',
          motivo:`Acima do máximo de ${regra.maxPorProva} nadadores em ${x.p.ev}` });
      });
    }
    selecionados = elegiveis.filter(c => keep.has(c.key));
    out.excluidos = out.excluidos.filter(e => !keep.has(e.key));
  } else {
    selecionados = elegiveis;
  }

  /* cota */
  if (regra.cota && selecionados.length > regra.cota){
    out.excluidos.push(...selecionados.slice(regra.cota).map(c => ({ ...c, via:'Índice',
      motivo:`Fora da cota de ${regra.cota} (ordenação por pontos WA acima do índice)` })));
    selecionados = selecionados.slice(0, regra.cota);
  }

  /* critérios adicionais */
  const jaLa = new Set(selecionados.map(c => c.key));
  for (const ad of (regra.adicionais || [])){
    const pool = cands.filter(c => c.g === ad.genero
      && (ad.idadeMin == null || (c.idade >= ad.idadeMin && c.idade <= ad.idadeMax)));
    const alvos = ad.base === 'grupos' ? Object.keys(GRUPOS_PROVA).filter(g => (ad.grupos||[]).includes(g)) : ['(qualquer prova)'];
    for (const grupo of alvos){
      const lista = [];
      for (const c of pool){
        const provasG = c.provas.filter(p => (!ad.piscina || p.curso === ad.piscina)
          && (grupo === '(qualquer prova)' || GRUPOS_PROVA[grupo].includes(p.ev)));
        const best = provasG.sort((a,b) => (b.pts||0) - (a.pts||0))[0];
        if (best) lista.push({ c, best });
      }
      lista.sort((a,b) => (b.best.pts||0) - (a.best.pts||0));
      let add = 0;
      for (const x of lista){
        if (add >= ad.n) break;
        add++;
        if (jaLa.has(x.c.key)){
          const alvo = selecionados.find(s => s.key === x.c.key);
          alvo.adicional = (alvo.adicional ? alvo.adicional + '; ' : '') +
            `${grupo}${grupo === '(qualquer prova)' ? '' : ''} (${x.best.pts}p)`;
          continue;
        }
        jaLa.add(x.c.key);
        selecionados.push({ ...x.c, via:'Critério adicional', melhor:x.best,
          delta:x.best.delta, pts:x.best.pts,
          adicional:`${ad.desc} — ${grupo === '(qualquer prova)' ? x.best.ev : grupo} (${x.best.pts}p)` });
      }
    }
  }

  /* nadadores convocados noutra atividade que arrastam elegibilidade (E2_AS_SEN) */
  if (regra.incluirConvocadosDe && cfg.convocatorias && cfg.convocatorias[regra.incluirConvocadosDe]){
    const origem = cfg.convocatorias[regra.incluirConvocadosDe];
    for (const m of (origem.membros || [])){
      if (m.estado === 'removido' || jaLa.has(m.key)) continue;
      const c = cands.find(x => x.key === m.key);
      if (!c) continue;
      jaLa.add(c.key);
      selecionados.push({ ...c, via:'Convocado para ' + regra.incluirConvocadosDe,
        adicional:`Integrado por convocatória para ${regra.incluirConvocadosDe}` });
    }
  }

  selecionados.sort((a,b) => a.g.localeCompare(b.g) || (b.delta ?? -1e9) - (a.delta ?? -1e9));
  out.apurados = selecionados;
  out.excluidos.sort((a,b) => (b.delta ?? -1e9) - (a.delta ?? -1e9));
  const jaExcl = new Set(out.excluidos.map(x => x.key).concat(selecionados.map(x => x.key)));
  out.excluidos.push(...naoCumprem.filter(x => !jaExcl.has(x.key)));
  return out;
}

/* ---------- ZIP (armazenado, sem compressão) ---------- */
const CRC_TBL = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TBL[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipBuild(entries){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const e of entries){
    const name = enc.encode(e.name);
    const data = typeof e.data === 'string' ? enc.encode(e.data) : e.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + data.length;
  }
  const cdSize = central.reduce((s,c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eocd]);
}
const xesc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- XLSX ---------- */
/* folhas: [{name, rows:[[...]], widths:[..], titulo?}] */
function buildXlsx(folhas){
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<font><sz val="10"/><name val="Calibri"/></font>

<font><b/><sz val="13"/><color rgb="FF14384F"/><name val="Calibri"/></font>
<font><i/><sz val="9"/><color rgb="FF667788"/><name val="Calibri"/></font>
</fonts>
<fills count="4">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF14384F"/><bgColor indexed="64"/></patternFill></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFEDF2F6"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="2"><border/><border><left style="thin"><color rgb="FFCBD6DF"/></left><right style="thin"><color rgb="FFCBD6DF"/></right><top style="thin"><color rgb="FFCBD6DF"/></top><bottom style="thin"><color rgb="FFCBD6DF"/></bottom></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="5">
<xf xfId="0" numFmtId="0" fontId="0" fillId="0" borderId="0"/>
<xf xfId="0" numFmtId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="center" wrapText="1"/></xf>
<xf xfId="0" numFmtId="0" fontId="0" fillId="0" borderId="1" applyBorder="1"><alignment vertical="center"/></xf>
<xf xfId="0" numFmtId="0" fontId="2" fillId="0" borderId="0" applyFont="1"/>
<xf xfId="0" numFmtId="0" fontId="3" fillId="0" borderId="0" applyFont="1"/>
</cellXfs></styleSheet>`;

  const sheetXml = (f) => {
    let rows = '', ri = 0;
    const cell = (r, c, v, st) => {
      const col = String.fromCharCode(65 + (c % 26));
      const ref = (c >= 26 ? String.fromCharCode(64 + Math.floor(c/26)) : '') + col + r;
      if (v === '' || v == null) return `<c r="${ref}" s="${st}"/>`;
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
      return `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    };
    if (f.titulo){ ri++; rows += `<row r="${ri}">${cell(ri,0,f.titulo,3)}</row>`; }
    if (f.sub){ ri++; rows += `<row r="${ri}">${cell(ri,0,f.sub,4)}</row>`; }
    if (f.titulo || f.sub) ri++;
    const headRow = ri + 1;
    f.rows.forEach((r, i) => {
      ri++;
      const st = (i === 0 && f.head !== false) ? 1 : 2;
      rows += `<row r="${ri}"${st === 1 ? ' ht="26" customHeight="1"' : ''}>` +
        r.map((v, c) => cell(ri, c, v, st)).join('') + '</row>';

    const cols = (f.widths || []).map((w, i) =>
      `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
    const nCols = Math.max(1, ...f.rows.map(r => r.length));
    const lastCol = String.fromCharCode(64 + Math.min(26, nCols));
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="${headRow}" topLeftCell="A${headRow+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${rows}</sheetData>
<autoFilter ref="A${headRow}:${lastCol}${ri}"/></worksheet>`;
  };

  const names = [], used = new Set();
  for (const f of folhas){
    let n = String(f.name).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31) || 'Folha';
    let i = 2; while (used.has(n)) n = (n.slice(0,28) + '_' + i++);
    used.add(n); names.push(n);
  }
  const entries = [
    { name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${folhas.map((f,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>` },
    { name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:'xl/workbook.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${names.map((n,i) => `<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>` },
    { name:'xl/_rels/workbook.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${names.map((n,i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name:'xl/styles.xml', data: styles }
  ];
  folhas.forEach((f,i) => entries.push({ name:`xl/worksheets/sheet${i+1}.xml`, data: sheetXml(f) }));
  return zipBuild(entries);
}

/* ---------- DOCX ---------- */
/* blocos: {h1|h2|h3|p|small|bullets|table|pagebreak} */
function buildDocx(blocos, titulo){

    `<w:p><w:pPr><w:pStyle w:val="${style}"/>${extra}</w:pPr><w:r><w:t xml:space="preserve">${xesc(txt)}</w:t></w:r></w:p>`;
  let body = '';
  for (const b of blocos){
    if (b.pagebreak){ body += '<w:p><w:r><w:br w:type="page"/></w:r></w:p>'; continue; }
    if (b.rule){ body += '<w:p><w:pPr><w:pStyle w:val="Espaco"/><w:pBdr><w:bottom w:val="single" w:sz="6" w:color="CBD6DF"/></w:pBdr></w:pPr></w:p>'; continue; }
    if (b.h1) body += P(b.h1, 'T1');
    if (b.h2) body += P(b.h2, 'T2');
    if (b.h3) body += P(b.h3, 'T3');
    if (b.p)  body += P(b.p, 'Corpo');
    if (b.small) body += P(b.small, 'Nota');
    if (b.bullets) for (const t of b.bullets)
      body += `<w:p><w:pPr><w:pStyle w:val="Corpo"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr></w:pPr><w:r><w:t xml:space="preserve">${xesc(t)}</w:t></w:r></w:p>`;
    if (b.table){
      const tb = b.table;
      const linhas = Array.isArray(tb) ? tb : [tb.head, ...tb.rows];
      const rel = (Array.isArray(tb) ? b.widths : tb.widths) || linhas[0].map(() => 1);
      const somaRel = rel.reduce((a,c) => a + c, 0);
      const w = rel.map(x => Math.max(400, Math.round(x / somaRel * 9360)));
      let rows = '';
      linhas.forEach((r, ri) => {
        const head = ri === 0;
        rows += `<w:tr>${head ? '<w:trPr><w:tblHeader/></w:trPr>' : ''}` + r.map((c, ci) =>
          `<w:tc><w:tcPr><w:tcW w:w="${w[ci]}" w:type="dxa"/>${head ? '<w:shd w:val="clear" w:fill="14384F"/>' : ''}<w:vAlign w:val="center"/></w:tcPr>` +
          `<w:p><w:pPr><w:pStyle w:val="Cel"/></w:pPr><w:r><w:rPr>${head ? '<w:b/><w:color w:val="FFFFFF"/>' : ''}</w:rPr><w:t xml:space="preserve">${xesc(c)}</w:t></w:r></w:p></w:tc>`
        ).join('') + '</w:tr>';
      });
      body += `<w:tbl><w:tblPr><w:tblStyle w:val="Grelha"/><w:tblW w:w="0" w:type="auto"/>
<w:tblBorders><w:top w:val="single" w:sz="4" w:color="CBD6DF"/><w:left w:val="single" w:sz="4" w:color="CBD6DF"/><w:bottom w:val="single" w:sz="4" w:color="CBD6DF"/><w:right w:val="single" w:sz="4" w:color="CBD6DF"/><w:insideH w:val="single" w:sz="4" w:color="CBD6DF"/><w:insideV w:val="single" w:sz="4" w:color="CBD6DF"/></w:tblBorders></w:tblPr>
<w:tblGrid>${w.map(x => `<w:gridCol w:w="${x}"/>`).join('')}</w:tblGrid>${rows}</w:tbl><w:p><w:pPr><w:pStyle w:val="Espaco"/></w:pPr></w:p>`;
    }
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709"/></w:sectPr></w:body></w:document>`;
  const st = (id, name, sz, opts='') =>
    `<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:pPr><w:spacing w:before="${opts.before||0}" w:after="${opts.after||120}"/></w:pPr><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="${sz}"/>${opts.rpr||''}</w:rPr></w:style>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults>
${st('T1','Titulo 1',36,{before:0,after:120,rpr:'<w:b/><w:color w:val="14384F"/>'})}
${st('T2','Titulo 2',26,{before:280,after:100,rpr:'<w:b/><w:color w:val="0A5F8F"/>'})}
${st('T3','Titulo 3',22,{before:200,after:80,rpr:'<w:b/><w:color w:val="14384F"/>'})}
${st('Corpo','Corpo',20,{after:100})}
${st('Nota','Nota',17,{after:100,rpr:'<w:i/><w:color w:val="667788"/>'})}
${st('Cel','Celula',17,{after:20})}
${st('Espaco','Espaco',12,{after:0})}
</w:styles>`;
  const numbering = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:pPr><w:ind w:left="360" w:hanging="220"/></w:pPr></w:lvl></w:abstractNum>
<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>`;
  return zipBuild([
    { name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>` },
    { name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>` },
    { name:'word/_rels/document.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>` },
    { name:'word/document.xml', data: doc },
    { name:'word/styles.xml', data: styles },
    { name:'word/numbering.xml', data: numbering }
  ]);
}

/* ---------- PDF ---------- */
const TRANSLIT = { '→':'->', '←':'<-', '↔':'<->', 'Δ':'Delta', '≈':'~', '≥':'>=', '≤':'<=',
  '”':'"', '“':'"', '′':"'", '″':'"', '\u00a0':' ', '\u2009':' ', '\u202f':' ' };
const WIN1252 = { '€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,
  '‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,
  'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159 };
function pdfStr(s){
  let out = '';
  let src = String(s ?? '');
  for (const [k, v] of Object.entries(TRANSLIT)) if (src.includes(k)) src = src.split(k).join(v);
  for (const ch of src){
    let code = WIN1252[ch] ?? ch.codePointAt(0);
    if (code > 255) code = 63;                                   // "?" para o que não cabe
    const c = String.fromCharCode(code);
    out += (c === '(' || c === ')' || c === '\\') ? '\\' + c : c;
  }
  return out;
}
const HELV_W = null; // largura aproximada: usamos métricas médias por carácter
function textWidth(s, size, bold){
  // aproximação Helvetica: suficiente para truncar e alinhar colunas
  let w = 0;
  for (const ch of String(s ?? '')){
    const c = ch.charCodeAt(0);
    let u = 0.5;
    if ('ijltfIJ.,:;\'`|!'.includes(ch)) u = 0.28;
    else if ('mwMW@'.includes(ch)) u = 0.83;
    else if (ch >= '0' && ch <= '9') u = 0.556;
    else if (c >= 65 && c <= 90) u = 0.69;
    else if (ch === ' ') u = 0.28;
    w += u;
  }
  return w * size * (bold ? 1.04 : 1);
}
function truncate(s, maxW, size, bold){
  s = String(s ?? '');
  if (textWidth(s, size, bold) <= maxW) return s;
  let out = '';
  for (const ch of s){
    if (textWidth(out + ch + '…', size, bold) > maxW) break;
    out += ch;
  }
  return out + '…';
}
function wrapText(s, maxW, size, bold){
  const words = String(s ?? '').split(/\s+/), lines = [];
  let cur = '';
  for (const w of words){
    const cand = cur ? cur + ' ' + w : w;
    if (textWidth(cand, size, bold) > maxW && cur){ lines.push(cur); cur = w; }
    else cur = cand;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/* blocos PDF: {h1,h2,h3,p,small,bullets,table:{head,rows,widths},pagebreak,rule} */
function buildPdf(blocos, opts = {}){
  const land = !!opts.landscape;
  const PW = land ? 842 : 595, PH = land ? 595 : 842;
  const M = 40, CW = PW - M*2;
  const pages = [];
  let ops = [], y = 0, pageNo = 0;
  const COL = { ink:'0.07 0.13 0.20', mid:'0.40 0.48 0.55', accent:'0.04 0.37 0.56',
                head:'0.078 0.220 0.310', zebra:'0.945 0.965 0.976', line:'0.80 0.85 0.89' };

  const newPage = () => {
    if (ops.length) pages.push(ops);
    ops = []; pageNo++;
    y = PH - M - 8;
    if (opts.header){
      ops.push(`q 0.04 0.37 0.56 rg 0 0 0 RG BT /F2 8 Tf ${M} ${PH - M + 6} Td (${pdfStr(opts.header.toUpperCase())}) Tj ET Q`);
      ops.push(`q 0.80 0.85 0.89 RG 0.6 w ${M} ${PH - M} m ${PW - M} ${PH - M} l S Q`);
    }
  };
  const need = h => { if (y - h < M + 24) newPage(); };
  const txt = (s, x, yy, size, font, color) =>
    ops.push(`q ${color} rg BT /${font} ${size} Tf ${x} ${yy} Td (${pdfStr(s)}) Tj ET Q`);

  newPage();
  for (const b of blocos){
    if (b.pagebreak){ newPage(); continue; }
    if (b.rule){ need(14); ops.push(`q ${COL.line} RG 0.6 w ${M} ${y} m ${PW-M} ${y} l S Q`); y -= 14; continue; }
    if (b.h1){
      need(34);
      for (const l of wrapText(b.h1, CW, 17, true)){ txt(l, M, y-13, 17, 'F2', COL.head); y -= 21; }
      y -= 8;
    }
    if (b.h2){
      need(26);
      y -= 6;
      for (const l of wrapText(b.h2, CW, 12.5, true)){ txt(l, M, y-11, 12.5, 'F2', COL.accent); y -= 17; }
      y -= 4;
    }
    if (b.h3){
      need(20);
      for (const l of wrapText(b.h3, CW, 10, true)){ txt(l, M, y-9, 10, 'F2', COL.head); y -= 14; }
      y -= 2;
    }
    if (b.p){
      for (const l of wrapText(b.p, CW, 9, false)){ need(13); txt(l, M, y-8, 9, 'F1', COL.ink); y -= 12.5; }
      y -= 4;
    }
    if (b.small){
      for (const l of wrapText(b.small, CW, 7.6, false)){ need(11); txt(l, M, y-7, 7.6, 'F3', COL.mid); y -= 10.5; }
      y -= 4;
    }
    if (b.bullets){
      for (const it of b.bullets){
        const lines = wrapText(it, CW - 12, 9, false);
        lines.forEach((l, i) => {
          need(13);
          if (i === 0) txt('•', M, y-8, 9, 'F1', COL.accent);
          txt(l, M + 12, y-8, 9, 'F1', COL.ink);
          y -= 12.5;
        });
      }
      y -= 4;
    }
    if (b.table){
      const t = b.table;
      const total = t.widths.reduce((a,c) => a+c, 0);
      const ws = t.widths.map(w => w/total * CW);
      const drawHead = () => {
        need(22);
        ops.push(`q ${COL.head} rg ${M} ${y-15} ${CW} 15 re f Q`);
        let x = M + 4;
        t.head.forEach((h, i) => {
          txt(truncate(h, ws[i]-8, 7.2, true), x, y-10.5, 7.2, 'F2', '1 1 1');
          x += ws[i];
        });
        y -= 15;
      };
      drawHead();
      t.rows.forEach((r, ri) => {
        if (y - 14 < M + 24){ newPage(); drawHead(); }
        if (ri % 2 === 1) ops.push(`q ${COL.zebra} rg ${M} ${y-14} ${CW} 14 re f Q`);
        let x = M + 4;
        r.forEach((c, i) => {
          txt(truncate(c, ws[i]-8, 7.4, false), x, y-10, 7.4, 'F1', COL.ink);
          x += ws[i];
        });
        ops.push(`q ${COL.line} RG 0.4 w ${M} ${y-14} m ${PW-M} ${y-14} l S Q`);
        y -= 14;
      });
      y -= 10;
    }
  }
  if (ops.length) pages.push(ops);

  /* montagem do ficheiro */
  const objs = [];
  const add = s => { objs.push(s); return objs.length; };
  const fontIds = [];
  const kidsIds = [];
  const pagesId = 1 + pages.length*2 + 3 + 1;  // reservado abaixo
  const contentIds = [];
  pages.forEach((p, i) => {
    const stream = p.join('\n') + `\nq 0.40 0.48 0.55 rg BT /F3 7 Tf ${PW/2 - 12} ${M/2 + 4} Td (${pdfStr(String(i+1) + ' / ' + pages.length)}) Tj ET Q`;
    contentIds.push(add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`));
  });
  const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const f3 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>');
  const pagesObjId = objs.length + pages.length + 1;
  pages.forEach((p, i) => {
    kidsIds.push(add(`<< /Type /Page /Parent ${pagesObjId} 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R /F3 ${f3} 0 R >> >> /Contents ${contentIds[i]} 0 R >>`));
  });
  const pagesObj = add(`<< /Type /Pages /Count ${kidsIds.length} /Kids [${kidsIds.map(i => i + ' 0 R').join(' ')}] >>`);
  const catalog = add(`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`);
  const info = add(`<< /Title (${pdfStr(opts.titulo || 'Convocatória')}) /Producer (Convocatorias PAR 2027) >>`);

  let out = '%PDF-1.4\n';
  const offsets = [0];
  objs.forEach((o, i) => { offsets.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= objs.length; i++) out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  out += `trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
  return new Blob([bytes], { type:'application/pdf' });
}

/* ---------- entrega do ficheiro ao utilizador ---------- */
let _downloads = undefined;
async function getDownloads(){
  if (_downloads !== undefined) return _downloads;
  try { _downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }
  catch { _downloads = null; }
  return _downloads;
}
async function guardar(filename, data, alternativas = []){
  const dl = await getDownloads();
  const tentativas = [{ filename, data }, ...alternativas];
  if (!dl){
    // fora do ambiente publicado: descarregamento direto do navegador
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return { status:'saved', filename };
  }
  let ultimo = null;
  for (const t of tentativas){
    try { await dl.save({ filename:t.filename, data:t.data }); return { status:'saved', filename:t.filename }; }
    catch (e){
      ultimo = e;
      if (e && (e.code === 'declined' || e.code === 'rate_limited')) throw e;
      if (e && (e.code === 'rejected_extension' || e.code === 'extension_not_enabled')) continue;
      throw e;
    }
  }
  throw ultimo || new Error('Não foi possível guardar o ficheiro.');
}

/* perfil de um nadador face a uma atividade (para adições manuais) */
function perfil(n, ativ){
  const regra = ativ.regra || {};
  const cursosOk = regra.piscina || ['PL'];
  const idade = idadeEm(n.nasc, S.cfg.refIdade);
  const faixa = (regra.faixas || []).find(f => idade >= f.min && idade <= f.max);
  const provas = [];
  for (const r of n.res){
    if (!cursosOk.includes(r.curso)) continue;
    if (r.lap && !S.cfg.incluirLap) continue;
    if (regra.validadeIni && r.data && r.data < new Date(regra.validadeIni)) continue;
    if (regra.validadeFim && r.data && r.data > new Date(regra.validadeFim)) continue;
    const p = ptsDe(S.db, r);
    let it = null, ip = null;
    if (faixa){
      it = idxTime(S.cfg.indices, r.curso, faixa.nivel, r.g, r.ev);
      if (it) ip = waPts(S.db.bases[baseKey(r.curso === 'PC' ? 'SCM':'LCM', r.g, r.dist, r.stroke)], it);
    }
    const ex = provas.find(x => x.ev === r.ev && x.curso === r.curso);
    const c = { ev:r.ev, curso:r.curso, t:r.t, pts:p, idx:it, idxPts:ip,
      delta:(p != null && ip != null) ? p - ip : null, ok: it ? r.t <= it : false, data:r.data, prova:r.prova };
    if (ex){ if (c.t < ex.t) Object.assign(ex, c); } else provas.push(c);
  }
  provas.sort((a,b) => (b.pts||0) - (a.pts||0));
  const comIndice = provas.filter(p => p.ok);
  const melhor = comIndice.slice().sort((a,b) => (b.delta ?? -1e9) - (a.delta ?? -1e9))[0] || provas[0];
  return { key:n.key, nome:n.nome, nasc:n.nasc, g:n.g, idade, clube:n.clube, clubeCod:n.clubeCod,
    regiao:n.regiao, nivel: faixa ? faixa.nivel : null, provas, comIndice, melhor,
    delta: melhor ? melhor.delta : null, pts: melhor ? melhor.pts : null };
}

function gerarConvocatoria(ativId, silencioso){
  const ativ = ATIVIDADES.find(a => a.id === ativId);
  const r = resultado(ativId);
  const antiga = conv(ativId);
  const manuais = new Map();
  if (antiga) for (const m of antiga.membros) manuais.set(m.key, m);

  const membros = [];
  for (const a of r.apurados){
    const m = manuais.get(a.key);
    membros.push({
      key:a.key, nome:a.nome, estado: (m && m.estado === 'removido') ? 'removido' : 'auto',
      justificacao: m ? m.justificacao || '' : '',
      provas: m && m.provas ? m.provas
        : (ativ.tipo === 'Estágio' ? []
          : (a.comIndice && a.comIndice.length ? a.comIndice : (a.provas || [])).slice(0, 3).map(p => p.ev)),
      via: a.via, adicional: a.adicional || '', detalhe: a.detalhe || ''
    });
  }
  const autos = new Set(r.apurados.map(a => a.key));
  if (antiga) for (const m of antiga.membros)
    if (m.estado === 'adicionado' && !autos.has(m.key)) membros.push({ ...m });

  S.cfg.convocatorias[ativId] = {
    ativId, geradaEm:new Date().toISOString(), membros,
    treinadores: antiga ? antiga.treinadores || [] : [],
    blocos: antiga ? antiga.blocos || [] : [],
    estafetas: antiga ? antiga.estafetas || [] : [],
    email: antiga ? antiga.email : undefined,
    nota: antiga ? antiga.nota || '' : '',
    estado: antiga ? antiga.estado || 'rascunho' : 'rascunho'
  };
  salvar();
  if (!silencioso) toast(`Convocatória ${ativ.id} gerada: ${membros.filter(m => m.estado !== 'removido').length} nadadores.`);
}

function linhasConvocatoria(ativId){
  const ativ = ATIVIDADES.find(a => a.id === ativId);
  const c = conv(ativId); if (!c) return [];
  const r = resultado(ativId);
  const byKey = new Map(r.apurados.map(a => [a.key, a]));
  return c.membros.map(m => {
    let info = byKey.get(m.key);
    if (!info){
      const n = S.db && S.db.nadadores.get(m.key);
      info = n ? perfil(n, ativ) : { nome:m.nome, g:'', idade:'', clube:'—', regiao:'—', provas:[], comIndice:[] };
    }
    return { ...info, ...m, nome: info.nome || m.nome };
  });
}

/* ---------- gráfico de barras ---------- */
function barras(dados, opts = {}){
  // dados: [{lb, a, b}] onde a/b são séries (b opcional)
  const max = Math.max(1, ...dados.map(d => (d.a||0) + (d.b||0)));
  const box = el('div', {});
  if (opts.legenda){
    box.append(el('div', { class:'legend', html:
      `<span><b style="background:var(--serie-a)"></b>${esc(opts.legenda[0])}</span>` +
      `<span><b style="background:var(--serie-b)"></b>${esc(opts.legenda[1])}</span>` }));
  }
  const bars = el('div', { class:'bars' });
  for (const d of dados){
    const tot = (d.a||0) + (d.b||0);
    const tr = el('div', { class:'tr' });
    if (d.a) tr.append(el('i', { style:`width:${(d.a/max)*100}%;background:var(--serie-a)`, title:`${d.lb}: ${d.a}` }));
    if (d.b) tr.append(el('i', { style:`width:${(d.b/max)*100}%;background:var(--serie-b)`, title:`${d.lb}: ${d.b}` }));
    bars.append(el('div', { class:'bar', title:`${d.lb} — ${tot}` },
      el('div', { class:'lb' }, d.lb), tr, el('div', { class:'vv' }, String(tot))));
  }
  box.append(bars);
  return box;
}

function dbar(delta){
  if (delta == null) return el('span', { class:'muted' }, '—');
  const cap = 120, w = Math.min(Math.abs(delta), cap) / cap * 50;
  const b = el('div', { class:'dbar', title:`${delta > 0 ? '+' : ''}${delta} pontos WA face ao índice` });
  b.append(el('u', {}));
  b.append(el('i', { style: delta >= 0
    ? `left:50%;width:${w}%;background:var(--good)`
    : `right:50%;width:${w}%;background:var(--warn)` }));
  return b;
}

function estatisticas(){
  const convs = Object.values(S.cfg.convocatorias);
  const convocados = new Map();
  const porSel = {}, porRegiao = {}, porClube = {}, porIdade = {};
  const vistosSel = {};
  for (const c of convs){
    const ativ = ATIVIDADES.find(a => a.id === c.ativId); if (!ativ) continue;
    vistosSel[ativ.sel] = vistosSel[ativ.sel] || new Set();
    for (const l of linhasConvocatoria(c.ativId)){
      if (l.estado === 'removido') continue;
      const g = l.g || 'M';
      porSel[ativ.sel] = porSel[ativ.sel] || { a:0, b:0 };
      if (!vistosSel[ativ.sel].has(l.key)){
        vistosSel[ativ.sel].add(l.key);
        porSel[ativ.sel][g === 'M' ? 'a' : 'b']++;
      }
      if (!convocados.has(l.key)){
        convocados.set(l.key, l);
        if (l.regiao){ porRegiao[l.regiao] = porRegiao[l.regiao] || {a:0,b:0}; porRegiao[l.regiao][g==='M'?'a':'b']++; }
        if (l.clube){ porClube[l.clube] = (porClube[l.clube]||0) + 1; }
        if (l.idade){ porIdade[l.idade] = porIdade[l.idade] || {a:0,b:0}; porIdade[l.idade][g==='M'?'a':'b']++; }
      }
    }
  }
  return { convs, convocados, porSel, porRegiao, porClube, porIdade };
}

function contarPorNivel(){
  const nomes = Object.keys(NIVEIS).sort((a,b) => NIVEIS[a].ordem - NIVEIS[b].ordem);
  const cont = {}; nomes.forEach(n => cont[n] = { a:0, b:0 });
  for (const n of S.db.nadadores.values()){
    if (S.cfg.apenasPOR && n.nation && n.nation !== 'POR') continue;
    const idade = idadeEm(n.nasc, S.cfg.refIdade);
    for (const niv of nomes){
      const f = FAIXA_NIVEL[niv];
      if (idade < f[0] || idade > f[1]) continue;
      let ok = false;
      for (const r of n.res){
        const it = idxTime(S.cfg.indices, r.curso, niv, r.g, r.ev);
        if (it && r.t <= it){ ok = true; break; }
      }
      if (ok) cont[niv][n.g === 'M' ? 'a':'b']++;
    }
  }
  return nomes.map(n => ({ lb:NIVEIS[n].label, ...cont[n] }));
}

function cardTreinadores(ativ, ativos){
  const c = conv(ativ.id);
  const porClube = {};
  for (const l of ativos) if (l.clube) porClube[l.clube] = (porClube[l.clube] || 0) + 1;
  const ord = Object.entries(porClube).sort((a,b) => b[1]-a[1]);
  const regra = (ativ.treinadores[0] || '').match(/(\d+)/);
  const racio = (ativ.treinadores[0] || '').match(/1 por cada (\d+)/);
  const maxT = racio ? Math.max(1, Math.ceil(ativos.length / +racio[1])) : (regra ? +regra[1] : null);

  const tw = el('div', { class:'tw' }); const t = el('table');
  t.append(el('thead', {}, el('tr', {}, ...['#','Clube','Atletas','Treinador convidado','']
    .map(h => el('th', { class:h === '#' || h === 'Atletas' ? 'num':'' }, h)))));
  const tb = el('tbody', {});
  ord.forEach(([clube, n], i) => {
    const guardado = (c.treinadores || []).find(x => x.clube === clube) || {};
    const inp = el('input', { type:'text', placeholder:'nome do treinador' });
    inp.value = guardado.nome || '';
    inp.addEventListener('change', () => {
      c.treinadores = (c.treinadores || []).filter(x => x.clube !== clube);
      if (inp.value.trim()) c.treinadores.push({ clube, nome:inp.value.trim(), n });
      salvar();
    });
    tb.append(el('tr', {},
      el('td', { class:'num muted' }, String(i+1)),
      el('td', {}, el('span', { class:'nome' }, clube)),
      el('td', { class:'num' }, String(n)),
      el('td', {}, inp),
      el('td', {}, maxT && i < maxT ? el('span', { class:'pill good' }, 'dentro da cota')
        : maxT ? el('span', { class:'pill' }, 'fora da cota') : '')));
  });
  t.append(tb); tw.append(t);
  return el('div', { class:'card' },
    el('header', {}, el('div', {},
      el('h3', {}, 'Treinadores convidados'),
      el('div', { class:'small muted' }, ativ.treinadores.join(' · ') || 'Sem regra definida.')),
      el('span', { class:'sp', style:'flex:1' }),
      maxT ? el('span', { class:'pill acc' }, `máximo ${maxT}`) : null),
    el('div', { class:'body tight' }, ord.length ? tw : el('p', { class:'muted small', style:'padding:16px 18px' }, 'Sem nadadores convocados.')));
}
